# Dependabot version updates for the website (tools/sitegen) and its CI.
# Card code under releases/ belongs to each designer and is not tracked here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /tools/sitegen
    schedule:
      interval: weekly
    # Let new releases settle before proposing them; security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      sitegen-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - Website
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - Website
