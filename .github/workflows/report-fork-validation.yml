name: Report fork validation

on:
  workflow_run:
    workflows:
      - Validate info.yaml
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    name: Post validation report on fork PR
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      # This privileged workflow never checks out or executes code from the PR.
      - name: Download validation report
        uses: actions/download-artifact@v5
        with:
          pattern: validation-report-*
          path: validation-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Post validation report on PR
        uses: actions/github-script@v8
        env:
          REPORT_DIR: validation-report
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: Number(process.env.WORKFLOW_RUN_ID), per_page: 100 },
            );
            const artifact = artifacts.find(item => /^validation-report-\d+$/.test(item.name));
            if (!artifact) throw new Error('Validation report artifact was not found');
            const issue_number = Number(artifact.name.slice('validation-report-'.length));
            const findReport = directory => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const candidate = path.join(directory, entry.name);
                if (entry.isDirectory()) {
                  const nested = findReport(candidate);
                  if (nested) return nested;
                } else if (entry.name === 'validation-comment.md') {
                  return candidate;
                }
              }
              return '';
            };
            const reportFile = findReport(process.env.REPORT_DIR);
            if (!reportFile) throw new Error('Downloaded validation report was not found');
            const marker = '<!-- workshop-computer-info-yaml-validation -->';
            const report = fs.readFileSync(reportFile, 'utf8');
            const body = `${marker}\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }