name: Request PR previews

# Previews are served from the production Pages deployment under /pr/<number>/,
# so a PR change re-runs the main Pages workflow on the default branch, which
# rebuilds every open upstream-branch PR's preview (see pages.yml).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions: {}

jobs:
  request:
    # Only PRs from branches in the upstream repository itself; fork PRs and
    # PRs inside forks never get previews. Dependabot-triggered runs get a
    # read-only token and cannot dispatch, so its PRs' previews refresh with
    # the next deploy instead.
    if: github.repository == 'TomWhitwell/Workshop_Computer' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Rebuild the site and its PR previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"

      - name: Checkout scripts
        if: github.event.action == 'closed'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Note the removed preview
        if: github.event.action == 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Only rewrite an existing preview comment; never start one on close.
          marker='<!-- site-pr-preview -->'
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --jq ".[].body" | grep -qF "$marker"; then
            bash .github/scripts/pr-preview-comment.sh "$NUMBER" "**Site preview removed** because this PR was closed."
          fi
