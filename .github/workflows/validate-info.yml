name: Validate info.yaml

# Runs on every PR (no path filter) so it can be a required status check: a
# required check that never runs blocks the merge. PRs that touch no program
# card succeed immediately without a report.
on:
  pull_request:
    # ready_for_review refreshes the eligibility report when a draft is published.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - workshop-ops

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-info-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate changed card metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/sitegen/package-lock.json

      - name: Install validator dependencies
        run: npm ci --prefix tools/sitegen

      - name: Validate changed cards
        id: validate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The same change-set validation (src/validate/changeSet.js) backs the
          # pre-commit hook, so local commits and this check agree.
          set +e
          git diff --name-status -z "$BASE_SHA...$HEAD_SHA" | \
            node tools/sitegen/src/validate/prValidationCli.js validation-comment.md
          status=$?
          set -e

          if [[ -f validation-comment.md ]]; then
            cat validation-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Post validation report on PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('validation-comment.md') != ''
        uses: actions/github-script@v9
        env:
          REPORT_FILE: validation-comment.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- workshop-computer-info-yaml-validation -->';
            const report = fs.readFileSync(process.env.REPORT_FILE, 'utf8');
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Save validation report for fork PR
        if: always() && github.event.pull_request.head.repo.full_name != github.repository && hashFiles('validation-comment.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: validation-report-${{ github.event.pull_request.number }}
          path: validation-comment.md
          retention-days: 1

      - name: Fail on validation errors
        if: always() && steps.validate.outputs.status != '0'
        run: exit 1
