name: Build and Deploy GitHub Pages 

on:
  workflow_run:
    workflows: ["Synchronize repository metadata"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.repository.fork != true && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      # Fork previews retain their own github.io project URL. The upstream
      # production build emits canonical web-editor links on the custom domain.
      SITE_BASE_URL: ${{ github.repository == 'TomWhitwell/Workshop_Computer' && 'https://computer.musicthing.co.uk/' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefix tools/sitegen

      - name: Synchronize and check site curation
        run: |
          npm run sync-curation
          npm run check-curation

      - name: Build and test site
        run: |
          npm test --prefix tools/sitegen

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event.repository.fork != true || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
