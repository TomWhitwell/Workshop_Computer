name: Test metadata website

on:
  pull_request:
    branches:
      - main
      - workshop-ops
    paths:
      - 'tools/sitegen/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'documentation/info.yaml.md'
      - 'documentation/site-migration.md'

permissions:
  contents: read

concurrency:
  group: sitegen-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/sitegen/package-lock.json

      - name: Install exact dependencies
        run: npm ci --prefix tools/sitegen

      - name: Test site generator
        run: npm test --prefix tools/sitegen

      - name: Check curation
        run: npm run check-curation

      - name: Audit dependencies
        run: npm audit --prefix tools/sitegen

      - name: Check whitespace
        run: git diff --check
