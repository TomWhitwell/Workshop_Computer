    hide_flairs:
      - new
    limit: 8

  - id: dune-collection
    title: The Dune collection
    layout: video-strip
    cards:
      - 04_BYO_Benjolin
      - 15_MLRws
      - 41_blackbird
      - 11_goldfish


  - id: generative-sequencers
