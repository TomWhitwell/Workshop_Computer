# Flair administration for generated card pages.
# Edit this file to add, rename, remove, or reassign flairs.
# `available_flairs` defines the vocabulary; `assignments` maps card IDs to flair IDs.

available_flairs:
  - id: included
    label: Included
    description: Ships with the Workshop Computer as an included Program Card.
    color: "#087a34"
    text_color: "#ffffff"

  - id: new
    label: New
    description: Recently added highlight.
    color: "#8a5a00"
    text_color: "#ffffff"

  - id: classic
    label: Classic
    description: Loved and used by Workshop owners and players.
    color: "#a63d00"
    text_color: "#ffffff"

  - id: start-here
    label: Start Here
    description: Classic cards recommended for new users and everyone else.
    color: "#706000"
    text_color: "#ffffff"

  - id: updated
    label: Updated
    description: Recently revised firmware or documentation.
    color: "#007064"
    text_color: "#ffffff"

  - id: toms-pick
    label: Tom's Pick
    description: Recommended by Tom Whitwell of Music Thing Modular.
    color: "#6b3fa0"
    text_color: "#ffffff"

  - id: chris-pick
    label: Chris's Pick
    description: Recommended by Chris Johnson of ComputerCard and Plus Minus Audio.
    color: "#365f9d"
    text_color: "#ffffff"

  - id: wild
    label: Wild
    description: Chaotic, unpredictable, or aggressive cards.
    color: "#9a294f"
    text_color: "#ffffff"

  - id: useful
    label: Useful
    description: Properly useful cards that solve problems and make the system easier.
    color: "#336b3f"
    text_color: "#ffffff"

  - id: deep
    label: Deep
    description: Intricate and ambitious cards you can get lost in.
    color: "#354a78"
    text_color: "#ffffff"

  - id: magic
    label: Magic
    description: Extraordinary cards that should be impossible.
    color: "#7a3f75"
    text_color: "#ffffff"

  - id: instant-win
    label: Instant Win
    description: Simple and satisfying cards for people with short attention spans.
    color: "#ad4d16"
    text_color: "#ffffff"
