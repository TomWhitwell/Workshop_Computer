Name: Spatial Disorientation
short-description: Two-source binaural orbits, spatial mixing and Fig8, Pendulum or Wandering movement, with web presets and 8mu control.
summary: >-
  A headphone spatializer for two independent mono sources. Choose Twin Orbits,
  Spatial Mixer or Disorientation at startup. Twin Orbits has a shared height
  centre and sloping paths; Mixer has independent continuous A/B heights;
  Disorientation adds vertical movement and slope to Fig8, Pendulum and Wander.
  Elevation is a subtle headphone effect: height and slope may sound like small
  tonal or placement changes rather than obvious up/down movement. Results vary
  with listener, headphones and source material; displayed angles are virtual
  rendering targets, not guaranteed perceived positions. Separate saved mode
  settings, web presets and elevation tools, panel/CV control and direct 8mu
  pitch/roll positioning make it playable. Orbits offers normal/height fader pages;
  Disorientation elevation is set in the editor. Beta3 includes corrected roll
  direction and the tested repeated-save fix. Two sources and all 64 taps at 192 MHz.
Language: C++ (Pico SDK + ComputerCard)
Creator: Adrian Vos
