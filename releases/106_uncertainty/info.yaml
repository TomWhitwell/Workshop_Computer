# certainty: low — flashed and confirmed on hardware for noise/FRV/QRV.
# The card used to have a sixth block, a fixed +-1V comparator on Audio
# In 1 with a ~10Hz minimum-retrigger lockout — its crossing detection
# and rate limiter both worked on hardware, but the comparator idea has
# since been removed outright. Kept the alternating Pulse Out 1/2 toggle
# it drove, now fed directly by Pulse In 1 instead (see main.cpp) — not
# yet re-tested. The wavefolder went through two from-scratch attempts
# (hard triangle fold, then a smooth sine-table fold) that both sounded
# wrong on hardware, and has now been replaced with a port of Chris
# Johnson's proven Utility Pair wavefolder (antiderivative-antialiased
# fold; see dsp/wavefolder.h), with CV In 1 wired back in as bipolar
# drive modulation on top of Main. Also not yet re-tested. Update Status
# to Released and drop this note once both have been.
draft: true
Name: Uncertainty
short-description: Buchla 266-style noise/FRV/QRV, plus a wavefolder and pulse alternator.
summary: |
  A tribute to the Buchla 266 Source of Uncertainty — three noise colours
  (flat, low-biased, high-biased), a Fluctuating Random Voltage that glides
  continuously between new targets, and a Quantized Random Voltage that
  jumps to a new value on each trigger — sharing the card with an
  antialiased wavefolder (ported from Chris Johnson's Utility Pair) and a
  Pulse In 1 alternator that duplicates each incoming pulse across Pulse
  Out 1 and Pulse Out 2 in turn.
Language: C++ (Pico SDK)
Creator: Claude Code
Version: "0.1.0"
Status: WIP
License: MIT

tags:
  - source-of-uncertainty
  - random
  - noise
  - wavefolder
  - utility

panel:
  inputs:
    - id: AudioIn1
      name: Fold In
      description: Wavefolder input
    - id: CVIn1
      name: Fold Drive Mod
      description: Bipolar, adds directly onto the Main knob's drive amount, unclamped — enough negative CV inverts the signal before folding
    - id: CVIn2
      name: FRV Rate Mod
      description: Bipolar modulation of the FRV rate, +-6V, added on top of knob X
    - id: PulseIn1
      name: QRV Trigger / Alternator In
      description: Rising edge latches a new Quantized Random Voltage value. The same input is also duplicated straight through to Pulse Out 1/2, alternating which one gets each pulse.
  outputs:
    - id: AudioOut1
      name: Fold Out
      description: Wavefolder output
    - id: AudioOut2
      name: Noise Out
      description: Current noise colour (flat / low-biased / high-biased)
    - id: CVOut1
      name: FRV Out
      description: Fluctuating Random Voltage, free-running 0 to +6V, no range control
    - id: CVOut2
      name: QRV Out
      description: Quantized Random Voltage, 0 to +6V span set by knob Y
    - id: PulseOut1
      name: Alternator Out A
      description: A literal copy of Pulse In 1's timing, routed here on every other incoming pulse (alternates with Pulse Out 2)
    - id: PulseOut2
      name: Alternator Out B
      description: A literal copy of Pulse In 1's timing, routed here on the pulses Pulse Out 1 doesn't get

controls:
  switch:
    tap:
      name: Cycle Noise Colour
      description: Briefly press and release Down to cycle the noise source between flat, low-biased (pink, -3dB/oct) and high-biased (blue, +3dB/oct). LEDs 0/2/4 hold the current mode.

  knobs:
    - main:
        name: Fold Drive
        description: Gain into the wavefolder, combined with CV In 1 — low settings pass the signal clean, higher settings drive it into folding
      x:
        name: FRV Rate
        description: Exponential taper across three decades, 0.05Hz to 50Hz, modulated by CV In 2
      y:
        name: QRV Range
        description: Sets the maximum span of each new Quantized Random Voltage draw, 0 to +6V

  leds:
    - display: list
      items:
        - id: "0"
          name: Noise: Flat
          description: Lit when the noise source is in flat (white) mode
        - id: "1"
          name: FRV Level
          description: Brightness follows the current FRV output, 0V off to +6V brightest
        - id: "2"
          name: Noise: Low-biased
          description: Lit when the noise source is in low-biased (pink) mode
        - id: "3"
          name: QRV Level
          description: Brightness follows the current QRV output, 0V off to +6V brightest
        - id: "4"
          name: Noise: High-biased
          description: Lit when the noise source is in high-biased (blue) mode
        - id: "5"
          name: Alternator Trigger
          description: Lit for the duration of every pulse on Pulse In 1, regardless of which of Pulse Out 1/2 it's currently being routed to

uf2:
  - path: UF2/uncertainty.uf2
    name: Uncertainty firmware
