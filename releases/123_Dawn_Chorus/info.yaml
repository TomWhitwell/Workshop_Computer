uf2:
  - path: UF2/dawn_chorus_v0.14.uf2
    name: Dawn Chorus 0.14

panel:
  inputs:
    - id: CVIn1
      name: Lead Bird CV
      type: cv
      description: Chooses which of the four local birds leads. With a cable in, X becomes an offset and 0 to +5 V covers the whole range, so with X at 12 o'clock a looping 0-5 V slope passes the lead through all of them. Turn X to shift where the sweep starts. Unplugged, X works on its own.
    - id: CVIn2
      name: Chime Tone CV
      type: cv
      description: Steps through the six chime instruments. With a cable in, Y becomes an offset and 0 to +5 V covers the whole range, so with Y at 12 o'clock a looping 0-5 V slope sweeps through all six. Unplugged, Y works on its own.
    - id: PulseIn1
      name: Strike Chime
      type: pulse
      description: Each rising edge strikes a chime straight away, using the current key, instrument and daylight.
    - id: PulseIn2
      name: Start Bird
      type: pulse
      description: Each rising edge starts a bird phrase straight away, usually from the lead bird, if a voice is free and that bird isn't already singing.
  outputs:
    - id: AudioOut1
      name: Drone
      type: audio
      description: Root, fifth and octave. Daylight raises its level and brightness, cloud dulls it, and wind adds vibrato, beating and slow gusting swells. Rain adds a soft crackle and faint hiss.
    - id: AudioOut2
      name: Chimes and Birds
      type: audio
      description: Chimes through a feedback delay that wind wobbles like tape, plus dry birds with a light reverb of their own. The birds are the four local, seasonal birds, each with its own synthesised voice and repertoire. Chimes are quieter and softer before sunrise. Rain adds its own independent crackle.
    - id: CVOut1
      name: Daylight
      type: cv
      description: 0 V at night, rising to +5 V in full daylight. Patch it to a filter's FM input to open other sounds with the dawn.
    - id: CVOut2
      name: Chime Pitch
      type: cv
      description: 1 V/oct pitch of the most recent chime, so other voices can follow the melody.
    - id: PulseOut1
      name: Chime Trigger
      type: pulse
      description: A 10 ms trigger on every chime, including those struck from Pulse In 1.
    - id: PulseOut2
      name: Bird Trigger
      type: pulse
      description: A 10 ms trigger at the start of every bird phrase.

controls:
  switch:
    middle:
      name: Normal
      description: The full soundscape, following the sun and weather sent from the page.
    up:
      name: Sparse
      description: Chimes and birds at 40% of normal density. The drone and weather responses are unchanged.
    tap:
      name: Daylight Preview
      description: Tap down to hear full daylight for 10 seconds. It fades in over half a second and back out over the last two, then returns to the real sky. Tapping again during a preview restarts the 10 seconds.
  knobs:
    - main:
        name: Key
        description: 12 o'clock is D, and each of the 12 steps is a semitone. The drone, chimes and CV Out 2 all follow, with a short glide. Turning it to a new key plays a chime, so you hear the change at any hour.
      x:
        name: Lead Bird
        description: Five positions. Fully anticlockwise, all four local birds share the singing. Each step clockwise picks one to lead, from the most likely to the fourth. The lead sings most and the others fill in with short calls, including while the lead is mid-song. If the lead isn't awake at this hour, the others carry on. Turning X to a new position plays that bird. CV In 1 moves it too.
      y:
        name: Chime Instrument
        description: Anticlockwise to clockwise, marimba, harp, xylophone, bell, vibraphone and glockenspiel. The first three use Casio CZ-style phase distortion and the last three use FM. Turning it to a new instrument plays a chime. CV In 2 moves it too, without the extra chime.
  leds:
    - display: list
      items:
        - id: LED0
          name: Daylight
          description: Brightness follows the daylight level, as CV Out 1.
        - id: LED1
          name: USB Link
          description: Solid while the page is sending. Blinking slowly means no page has connected yet, or the link has dropped and the card is holding its last values.
        - id: LED2
          name: Birdsong
          description: Brightness follows how active the birds are at this time of day.
        - id: LED3
          name: Cloud
          description: Brightness follows the cloud cover.
        - id: LED4
          name: Chime
          description: Flashes on each chime.
        - id: LED5
          name: Bird
          description: Flashes at the start of each bird phrase.

host:
  usb:
    - name: Dawn Chorus host page
      role: editor
      description: Opens from the Web Editor button in Chrome or Edge on a laptop or desktop. It calculates the sun's position for your location, fetches hourly weather from Open-Meteo and seasonal bird records from GBIF (both free, no account), and sends them to the card ten times a second over USB serial.
  notes: |
    The card needs the page to know where the sun is. With nothing connected it sits at night, so it is almost
    silent apart from the occasional chime. Tap the switch down to preview daylight. If the USB link drops,
    the card holds its last values until the page reconnects.

    Web Serial is supported in Chrome and Edge on desktop only. Safari and Firefox can't connect.
