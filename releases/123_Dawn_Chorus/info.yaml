Name: Dawn Chorus
short-description: An ambient soundscape that follows the real sun and the local weather, fed live over USB from a browser page. It swells at sunrise and fades to silence through dusk.
summary: |
  Connect the Computer to a laptop, open the Dawn Chorus page in Chrome or Edge, and set your location.
  The page works out where the sun is and fetches the local weather, then streams both to the card over USB.
  As the sun rises, a drone swells and brightens, chimes ring out, and synthetic birds wake from first light,
  peak just after sunrise and stay through the day. Through dusk, everything settles back to silence.

  The birds are local and seasonal. The page finds the four birds most likely near you at this time of year
  in [GBIF](https://www.gbif.org)'s open records, and the card gives each its own synthesised voice and songs:
  screaming swifts, a blackbird, a robin and a blackcap in a British June, with a tawny owl at night.
  X picks which of them leads.

  The weather is the score. Cloud dulls the drone. Wind adds vibrato, beating and gusts, and makes the echoes
  and chimes waver. Warmth brightens the chimes, humidity lengthens the echoes, and rain brings a soft vinyl crackle.
  Because the data comes from the real sky above you, no two dawns sound the same.

  A **Fast** mode plays a whole sunrise or sunset in a couple of minutes, and **Manual** mode lets you audition
  each value with sliders. Inspired by the tides of Matt Allison's [Equanimity](https://github.com/TomWhitwell/Workshop_Computer/tree/main/releases/112_Equanimity) card.
Language: C++ (Pico SDK + ComputerCard)
Creator: Joe Hedinger
Version: "0.14"
Status: Beta
date-created: 2026-10-05
date-updated: 2026-10-31
