Name: Tapegrade
draft: false
date-created: 2026-06-14
date-updated: 2026-07-09
summary: Give a mono signal gentle stereo wobble or worn-out cassette sounds. Tapegrade uses
  wow, flutter, hiss, crackle and changing tape wear to move between those textures.
short-description: Turn a mono input into stereo cassette wobble, with wow, flutter, hiss, crackle and
  changing tape wear.
Language: C++ (Pico SDK + ComputerCard)
Creator: Adrian Vos
Version: 0.8.0
Status: Beta
License: MIT
demo-link: https://www.youtube.com/watch?v=X9NSBJfStic
panel:
  inputs:
    - id: AudioIn1
      name: |-
        Mono Audio
        In
      description: Primary mono source signal for tape processing
      type: audio
    - id: AudioIn2
      name: |-
        Tape
        Condition
      description: Audio/CV modulation that morphs between cleaner and more degraded
        tape states
      type: audio
    - id: CVIn1
      name: |-
        Tape Depth
        Mod
      description: Modulates wow/pitch movement amount; also routed to CV Out 1
        attenuator path
      type: cv
    - id: CVIn2
      name: |-
        Instability
        Mod
      description: Modulates flutter/transport agitation; also routed to CV Out 2
        attenuator path
      type: cv
    - id: PulseIn1
      name: |-
        Damage Burst
        Trig
      description: Rising edge forces brief heavy tape degradation burst
      type: pulse
    - id: PulseIn2
      name: Crackle Gate
      description: High gate forces stronger crackle generation
      type: pulse
  outputs:
    - id: AudioOut1
      name: |-
        Stereo Out
        Left
      description: Processed cassette-style left output
      type: audio
    - id: AudioOut2
      name: |-
        Stereo Out
        Right
      description: Processed cassette-style right output
      type: audio
    - id: CVOut1
      name: |-
        CV1
        Attenuated
      description: CV In 1 passthrough scaled by X knob
      type: cv
    - id: CVOut2
      name: |-
        CV2
        Attenuated
      description: CV In 2 passthrough scaled by Y knob
      type: cv
tags:
  - tape
  - degradation
  - stereo
  - modulation
  - lo-fi
controls:
  switch:
    up:
      name: New
      description: Brighter and more stable tape response.
    middle:
      name: Old
      description: Darker tone with moderate hiss and instability.
    down:
      name: Damaged
      description: Strong hiss, crackle, and unstable behavior.
  knobs:
    - main:
        name: |-
          Wet / Dry
          Mix
        description: Blend between dry input and processed tape signal
      x:
        name: Tape Depth
        description: Increases wow and pitch instability; also sets CV Out 1 attenuation
      y:
        name: Instability
        description: Increases flutter/transport roughness; also sets CV Out 2 attenuation
  leds:
    - display: list
      items:
        - id: LED0
          name: LED 1
          description: LED 1 follows modulated left delay movement.
        - id: LED1
          name: LED 2
          description: LED 2 follows instability.
        - id: LED2
          name: LED 3
          description: LED 3 follows modulated right delay movement.
        - id: LED3
          name: LED 4
          description: LED 4 follows wet/dry mix.
        - id: LED4
          name: LED 5
          description: LED 5 follows tape condition and damage state.
host:
  notes: Main blends dry and wet sound. X sets tape depth and CV1 attenuation; Y sets
    instability and CV2 attenuation. Choose clean, old or damaged tape with the switch,
    or use Audio In 2 to move continuously between tape conditions. Pulse In 1 triggers
    a short burst of heavy damage. Hold Pulse In 2 high for strong crackle.
contact:
  social:
    github: https://github.com/soveda
