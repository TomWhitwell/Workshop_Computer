# This card is a port of the "Spectral Clouds" playback mode from Julius
# Kammerl's fork of Mutable Instruments Clouds (https://www.kammerl.de/audio/
# clouds/, https://github.com/jkammerl/eurorack), itself derived from Clouds
# by Emilie Gillet. Both are MIT; this card keeps the same licence. See
# README.md's Credits section.

contact:
  social:
    github: https://github.com/uglifruit

uf2:
  - path: UF2/spectral.uf2
    name: SPECTRAL 1.0.0

tags:
  - effect
  - spectral
