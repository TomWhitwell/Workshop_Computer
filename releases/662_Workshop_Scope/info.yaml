Name: Workshop Scope
short-description: USB oscilloscope, XY, spectrum, slow-roll and pulse BPM display for the Workshop Computer
Language: C (Pico SDK)
Creator: MrJoshua
Version: "0.1.0"
Status: Beta
License: MIT
Editor: web
date-created: 2026-10-23
date-updated: 2026-10-23

