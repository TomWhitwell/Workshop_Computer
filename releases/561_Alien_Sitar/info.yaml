# Workshop Computer card metadata; schema: https://github.com/TomWhitwell/Workshop_Computer/blob/main/documentation/info.yaml.md
draft: false
Name: Alien Sitar
short-description: Sitar-inspired plucks, jawari buzz and twelve tunable sympathetic strings.
summary: A sitar-inspired plucked instrument with evolving jawari buzz, secondary swells and
  twelve sympathetic strings. Main controls Jawari, X controls Swell and Y controls String.
  Tap Down or trigger PulseIn1 to pluck. Hold Down and deliberately move a knob to edit its
  assigned secondary setting; the webpage can reassign each knob. Switch Up uses incoming audio
  to excite the melody string and sympathetic halo, with an adjustable dry/wet mix. Start with
  Jawari and Swell near 65%, String near 80%, and AudioOut1 connected to a mixer. Unpatched
  pitch is D3. The sympathetic bank defaults to a D-tonic Yaman adaptation with D4 as Sa; its
  notes can be edited individually. Halo output level defaults to 50%, independently of Sympathy.
  Melody and sympathetic durations each cover 25–400%. The USB webpage provides tuning presets,
  held-control assignments, user pitch CV corrections, and explicit Save/Restore on the program
  card. CVOut1 follows played pitch with bend and octave edits; PulseOut2 responds to a rising
  halo.
Language: C++ (Pico SDK)
Creator: mcmadhatter
Version: "1.1.0"
Status: Beta
License: MIT
Editor: web
tags:
- synthesizer
