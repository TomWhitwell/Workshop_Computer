Name: DualQuant
draft: false
summary: Dual quantised granular pitch shifter with calibrated 1V/oct CV outputs
short-description: Dual quantised granular pitch shifter with calibrated 1V/oct CV outputs
Language: C++ (ComputerCard / Pico SDK)
Creator: Adrian Vos
Version: "1.0"
Status: Beta - stable in single-developer testing
License: MIT
date-created: 2026-06-14
date-updated: 2026-06-15
panel:
  inputs:
    - id: AudioIn1
      name: Audio In
      description: Source audio written into the shared granular delay buffer
      type: audio
    - id: CVIn1
      name: Pitch Mod A
      description: Additional semitone modulation for output A
      type: cv
    - id: CVIn2
      name: Pitch Mod B
      description: Additional semitone modulation for output B
      type: cv
  outputs:
    - id: AudioOut1
      name: |-
        Pitch Shift
        Out A
      description: Granular pitch-shifted output A
      type: audio
    - id: AudioOut2
      name: |-
        Pitch Shift
        Out B
      description: Granular pitch-shifted output B
      type: audio
    - id: CVOut1
      name: |-
        Pitch CV Out
        A
      description: Pitch A converted to millivolt CV output
      type: cv
    - id: CVOut2
      name: |-
        Pitch CV Out
        B
      description: Pitch B converted to millivolt CV output
      type: cv
tags:
  - granular
  - pitch-shifter
  - dual-output
  - quantizer
  - fixed-point
controls:
  switch:
    up:
      name: Z up
      description: "Z up: MAIN: Global Pitch Offset; X: Output A Offset; Y: Output B
        Offset."
    middle:
      name: Z middle
      description: "Z middle: MAIN: Quantize Enable."
  knobs:
    - main:
        name: |-
          Quantize
          Enable
        description: Enables chromatic semitone quantization for both outputs
  leds:
    - display: list
      items:
        - id: LED0
          name: LED 1
          description: "Quantized state: all LEDs on"
        - id: LED1
          name: LED 2
          description: "Unquantized state: all LEDs off"
host:
  notes: >
    DualQuantPitch runs two independent granular pitch-shifted outputs from one
    shared circular buffer.

    Main sets global pitch offset, X sets output A offset, and Y sets output B
    offset.

    CV In 1 and CV In 2 modulate pitch for outputs A and B respectively.

    Switch middle enables chromatic semitone quantization; other switch
    positions run continuously unquantized.

    The design intentionally favors gritty/lo-fi granular character over
    transparent pitch shifting. # certainty: medium (README is marked LLM
    output)
contact:
  social:
    github: https://github.com/soveda
