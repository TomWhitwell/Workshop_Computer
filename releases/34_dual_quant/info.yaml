Name: DualQuant
draft: false
summary: Turn one audio input into two granular pitch-shifted signals. Set their offsets
  together with Main or separately with X and Y, and use CV In 1 and 2 to modulate them.
  Middle enables chromatic quantisation. Calibrated 1V/oct CV outputs follow the
  pitches.
short-description: Two granular pitch shifters with chromatic quantisation and calibrated 1V/oct CV
  outputs.
Language: C++ (Pico SDK + ComputerCard)
Creator: Adrian Vos
Version: "1.0"
Status: Beta
License: MIT
date-created: 2026-06-14
date-updated: 2026-06-15
demo-link: https://www.youtube.com/watch?v=U5x2nZ9EiMI
panel:
  inputs:
    - id: AudioIn1
      name: Audio In
      description: Source audio written into the shared granular delay buffer
      type: audio
    - id: CVIn1
      name: Pitch Mod A
      description: Additional semitone modulation for output A
      type: cv
    - id: CVIn2
      name: Pitch Mod B
      description: Additional semitone modulation for output B
      type: cv
  outputs:
    - id: AudioOut1
      name: |-
        Pitch Shift
        Out A
      description: Granular pitch-shifted output A
      type: audio
    - id: AudioOut2
      name: |-
        Pitch Shift
        Out B
      description: Granular pitch-shifted output B
      type: audio
    - id: CVOut1
      name: |-
        Pitch CV Out
        A
      description: Pitch A converted to millivolt CV output
      type: cv
    - id: CVOut2
      name: |-
        Pitch CV Out
        B
      description: Pitch B converted to millivolt CV output
      type: cv
tags:
  - granular
  - pitch-shifter
  - dual-output
  - quantiser
  - fixed-point
controls:
  switch:
    up:
      name: Unquantised
      description: Continuous, unquantised pitch shifting. Main shifts both outputs; X sets output
        A offset and Y sets output B offset.
    middle:
      name: Quantised semitones
      description: Snap pitch shifts to chromatic semitones.
    down:
      name: Unquantised
      description: Continuous, unquantised pitch shifting. Main shifts both outputs; X sets output
        A offset and Y sets output B offset.
  knobs:
    - main:
        name: Global Pitch Offset
        description: Global pitch offset applied to both outputs
      x:
        name: Output A Offset
        description: Additional pitch offset for output A
      y:
        name: Output B Offset
        description: Additional pitch offset for output B
  leds:
    - display: list
      items:
        - id: LED0
          name: LED 1
          description: "Quantized state: all LEDs on"
        - id: LED1
          name: LED 2
          description: "Unquantized state: all LEDs off"
host:
  notes: >
    DualQuantPitch runs two independent granular pitch-shifted outputs from one shared
    circular buffer.

    Main sets global pitch offset, X sets output A offset, and Y sets output B offset.

    CV In 1 and CV In 2 modulate pitch for outputs A and B respectively.

    Switch middle enables chromatic semitone quantization; other switch positions run
    continuously unquantized.

    Expect gritty, lo-fi granular textures. Documentation certainty is medium because
    the README was marked as LLM output.
contact:
  social:
    github: https://github.com/soveda
