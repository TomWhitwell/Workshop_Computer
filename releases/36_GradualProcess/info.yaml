demo-link: https://youtu.be/_94dtPt-7Go?si=l9pn8flyIwNT0w1M

# Three power-on modes → three custom panels (see panels/manifest.yaml).
# Glass is the unconditioned base for shared sockets where labels match; Reich and
# Pärt override jacks/knobs that differ. Z Play/Stop/Settings are documented in
# controls.switch (when.z cannot combine with when.panel).
panel:
  inputs:
    - id: PulseIn1
      when: { panel: glass }
      name: Remove Unit
      type: pulse
      description: Debounced trigger; removes the most recently added unit (minimum 1 unit)
    - id: PulseIn2
      when: { panel: glass }
      name: Add Unit
      type: pulse
      description: Debounced trigger; appends a freshly-generated unit

  outputs:
    # Glass (default panel) — additive process after Philip Glass
    - id: CVOut1
      when: { panel: glass }
      name: Pitch
      type: cv
      description: v/oct pitch of the current phrase
    - id: CVOut2
      when: { panel: glass }
      name: Inversion
      type: cv
      description: Tonal inversion of CV Out 1 (each scale degree mirrored around the tonic), in rhythmic unison with CV Out 1
    - id: PulseOut1
      when: { panel: glass }
      name: Gate
      type: pulse
      description: ~10ms trigger, shared by both CV outputs since they always change together
    - id: PulseOut2
      when: { panel: glass }
      name: Phrase Sync
      type: pulse
      description: ~10ms pulse once at the start of each loop of the current phrase

    # Reich — discrete and gradual phasing
    - id: CVOut1
      when: { panel: reich }
      name: Voice 1 Pitch
      type: cv
      description: v/oct pitch, read from the primary beat position
    - id: CVOut2
      when: { panel: reich }
      name: Voice 2 Pitch
      type: cv
      description: v/oct pitch, same pattern, read from Voice 2's independently-clocked beat position
    - id: PulseOut1
      when: { panel: reich }
      name: Voice 1 Gate
      type: pulse
      description: ~10ms trigger on each Voice 1 note
    - id: PulseOut2
      when: { panel: reich }
      name: Voice 2 Gate
      type: pulse
      description: ~10ms trigger on each Voice 2 note — independent of Pulse Out 1 whenever the voices land on different beats

    # Pärt — tintinnabuli melody + harmony
    - id: CVOut1
      when: { panel: part }
      name: M-Voice Pitch
      type: cv
      description: v/oct melody pitch
    - id: CVOut2
      when: { panel: part }
      name: T-Voice Pitch
      type: cv
      description: v/oct harmony pitch from the tonic triad per the current harmonisation type — never in unison with the melody
    - id: PulseOut1
      when: { panel: part }
      name: M-Voice Gate
      type: pulse
      description: Sustained high for the note's full held duration, with a brief ~5ms low retrigger blip at the start of every new note
    - id: PulseOut2
      when: { panel: part }
      name: T-Voice Gate
      type: pulse
      description: Identical timing to Pulse Out 1 — the two voices always attack and release together

controls:
  switch:
    up:
      name: Play
      description: Run the selected process
    middle:
      name: Stop
      description: Halt playback
    down:
      name: Settings
      description: >
        Hold for settings — X = clock divide/multiply (/8…x8), Y = scale select
        (Major, Minor, Pentatonic Major/Minor, Blues, Chromatic). Main is
        process-specific while held: unused in Glass; Phrase Length (4–20 beats)
        in Reich; Harmonisation Type in Pärt. Mode itself is chosen by Main's
        third at power-on (CCW Glass / mid Reich / CW Pärt).

  knobs:
    - when: { panel: glass }
      main:
        name: Tempo
        description: Always active in Play. Additive-process phrase after Glass's Music in Similar Motion — grows/shrinks one melodic unit at a time.
      x:
        name: Clock Divide (Z hold)
        description: Unassigned in Play. While Z is held — seven steps /8 /4 /2 x1 x2 x4 x8.
      y:
        name: Add/Remove Unit
        description: >
          Play — zone gesture: flick CW past ~2/3 and back to centre to add a unit;
          flick CCW past ~1/3 and back to remove one. While Z is held — Scale Select
          (six scales).

    - when: { panel: reich }
      main:
        name: Tempo / Phrase Length
        description: >
          Play — tempo (always active). While Z is held — Phrase Length 4–20 beats
          (preset only; takes effect on the next fresh Play).
      x:
        name: Gradual Phase Drift
        description: >
          Play — three zones (CCW/centre/CW). CW makes Voice 2's clock run slightly
          faster than Voice 1, drifting a full beat every ~8–12 phrase repeats; CCW
          mirrors. Drift is sticky through the current beat. While Z is held —
          clock divide/multiply (/8…x8).
      y:
        name: Stepped Phase Shift
        description: >
          Play — flick CW and back to step Voice 2 one beat later; flick CCW and back
          one beat earlier. If an X drift is still running, the flick quick-locks it.
          While Z is held — Scale Select (six scales).

    - when: { panel: part }
      main:
        name: Tempo / Harmonisation
        description: >
          Play — tempo (always active). While Z is held — Harmonisation Type, six
          zones CCW→CW: inf-2nd, inf-1st, alt-2nd, alt-1st, sup-1st, sup-2nd.
      x:
        name: Clock Divide (Z hold)
        description: Unassigned in Play. While Z is held — seven steps /8 /4 /2 x1 x2 x4 x8.
      y:
        name: Scale (Z hold)
        description: >
          Unassigned in Play. While Z is held — Scale Select; also sets the tonic
          triad (major-family scales use a major triad; minor-family and blues use a
          minor triad).

  leds:
    - when: { panel: glass }
      display: list
      items:
        - id: LED0
          name: Unit count
          description: Current unit count, 1–6 lit / 7–12 mirrored; scale/clock-divide shown instead while Z is held
    - when: { panel: reich }
      display: list
      items:
        - id: LED0
          name: Phase offset
          description: How far Voice 2 has drifted from unison — more LEDs lit the further out of phase, 0 at unison; phrase length/clock-divide/scale while Z is held
    - when: { panel: part }
      display: list
      items:
        - id: LED0
          name: Harmonisation
          description: Current harmonisation type (single LED, 1–6); clock-divide/scale shown instead while Z is held
