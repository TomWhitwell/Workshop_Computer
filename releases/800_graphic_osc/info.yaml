Name: Graphic Osc
short-description: Draw an oscillator's wave with eight faders (8mu, web page, or both). Band-limited, with FM, sync and a Turing Machine.
summary: |
  **Graphic Osc** is an oscillator whose waveform you draw by hand: eight faders are the eight stages
  of one wave cycle. Use a Music Thing **8mu** plugged straight into the Computer's USB-C socket (the Computer
  acts as USB host), or a laptop running the bundled **web editor** (the Computer acts as a USB MIDI
  device; an 8mu can be plugged into the laptop instead). The card picks the role at power-up. Page buttons A-D switch the faders between stage **levels**, stage **times**,
  stage **curves** and a **performance** page (fine tune, level, symmetry, fold, brightness,
  odd/even harmonics, formant). Pitch comes from the Main knob plus **CV In 1** at 1 V/oct; the
  oscillator is on **Audio Out 1**.

  **Symmetry** (page 4) is smooth, and **CV In 2** controls it too, by a depth set with Knob Y (switch in
  the middle) - zero depth is no effect, full depth is CV In 2's old always-on range.

  Whatever you draw is played through band-limited wavetables that are rebuilt on the fly, so even
  hard steps and folded shapes do not alias at any pitch (measured on a PC harness, see README).

  **FM** (Audio In 1 modulates the oscillator's pitch) and **sync** (Audio In 2, soft or hard, stepped by a
  quick press of the Z switch) are also built in; they are less clean than the plain oscillator (see README
  for measurements). The **Z switch** chooses what the X and Y knobs do, and every knob-controlled setting
  uses soft takeover so nothing jumps.

  A small **Turing Machine sequencer** runs alongside: **Pulse In 1** clocks a 16-bit shift register,
  **CV Out 1** is the quantised note (1 V/oct, 2 octaves), **Pulse Out 2** is the register's least
  significant bit; with the Z switch up, **Knob X** locks the loop (clockwise = repeat, 12 o'clock = random,
  counter-clockwise = repeat inverted) and **Knob Y** picks one of eight scales.
