summary: |
  Turns a Game Boy Advance into a synth voice for your modular. The Workshop Computer loads custom
  software onto the GBA over its link cable using the GBA's built-in multiboot - no cartridge, no
  modifications. Your CV, knobs and gates then play the GBA's four sound channels, and the GBA sends
  its notes, gates and buttons back to the rack. Sound comes from the GBA's headphone jack; the
  sound editor is on the GBA's own screen. Works with the Game Boy Advance, GBA SP (with the SP
  headphone adapter) and Analogue Pocket.<br><br>

  THE CABLE. Wire one end of a link cable to the Workshop: GBA pin 5 (SC) to Pulse Out 1 through a
  1k resistor, pin 3 (SI) to Pulse Out 2 through a 1k resistor, pin 2 (SO) to Pulse In 1, and pin 6
  to ground. Leave pins 1 and 4 unconnected. Do not leave out the resistors - the pulse outputs swing
  to about 6V and the GBA runs at 3.3V. A Game Boy Color cable is best, as it has all six wires.<br><br>

  GETTING STARTED. Take the cartridge out. Switch on the Workshop first, then the GBA. The LEDs light
  in sequence as the software loads (about six seconds), the GBA screen goes green, and the MAIN page
  appears. Push the Z switch down to hear a note. If nothing happens, power-cycle the GBA - always
  needed after re-flashing the Workshop.<br><br>

  PLAYING. CV In 2 is 1V/oct pitch, the Main knob is channel 3's level, X and Y are attack and
  release, and the Z switch triggers. CV Out 2 is the quantised pitch, CV Out 1 the gate, and Audio
  Out 1 and 2 are the GBA's A and B buttons as gates. Everything else is yours to assign.<br><br>

  THE EDITOR. START opens it, SELECT + Left/Right changes page, A + D-pad changes values. Eleven
  pages: MEM (16 patch slots), CHAN, TRIG, ENV, MIX, BTN, MAP (modulation matrix), ORN (arpeggios),
  DRUM, CAL (trim 1V/oct tracking) and SET (key and scale quantising).<br><br>

  See the user manual PDF and README.md for a guided tour, and TECHNICAL.md for the full reference.

panel:
  inputs:
    - id: CVIn2
      name: Pitch
      description: 1V/oct pitch CV. Trim tracking on the GBA CAL page (CV inputs are not factory calibrated)
    - id: PulseIn2
      name: Gate
      description: Gate and trigger. Off in the factory patch - tick PU2 on the GBA's TRIG page to use it. Edges shorter than the 1ms poll are still caught
    - id: CVIn1
      name: Mod 1
      description: Unassigned by default - nothing should move that you did not patch. Give it a job on the MAP page, or arm it as a trigger source on the TRIG page
    - id: AudioIn1
      name: Mod 2
      description: Unassigned by default; assignable on the MAP page with per-voice tickboxes, or armable as a trigger source on the TRIG page
    - id: AudioIn2
      name: Mod 3
      description: Unassigned by default; assignable on the MAP page with per-voice tickboxes, or armable as a trigger source on the TRIG page
    - id: PulseIn1
      name: GBA SO (MISO)
      description: Serial data back from the GBA. Read directly via PIO, not the 48kHz pulse path
  outputs:
    - id: PulseOut1
      name: GBA SC (clock)
      description: Master serial clock driven by the RP2040 (PIO), inversion handled in hardware
    - id: PulseOut2
      name: GBA SI (MOSI)
      description: Serial data to the GBA (payload upload, then the live input stream)
    - id: CVOut2
      name: Quantised pitch
      description: The note the GBA is sounding, as calibrated 1V/oct. Turns the pair into a quantiser for the rest of the rack
    - id: CVOut1
      name: Gate out
      description: 5V while a note is sounding
    - id: AudioOut1
      name: A button gate
      description: High while the GBA's A button is held - the performance gesture as a patchable voltage
    - id: AudioOut2
      name: B button gate
      description: High while the GBA's B button is held

controls:
  knobs:
    - main:
        name: Level (Ch. 3)
        description: Level of channel 3 by default; assignable on the MAP page
      x:
        name: Attack
        description: Attack, both envelopes together, by default; assignable on the MAP page
      y:
        name: Release
        description: Release, both envelopes together, by default; assignable on the MAP page

  switch:
    down:
      name: Trigger
      description: Momentary down fires a note; a column of the GBA's TRIG grid
    up:
      name: Modulation
      description: An eighth source on the GBA's MAP page - assign it to anything. Up is full, middle and down are zero

  leds:
    - display: list
      items:
        - id: LED0
          name: Link (solid booted, blinking connecting)
        - id: LED1
          name: Gate in / upload progress / fault code bit 0
        - id: LED2
          name: Note sounding / upload progress / fault code bit 1
        - id: LED3
          name: Editing on the GBA / upload progress / fault code bit 2
        - id: LED4
          name: Edit page bit 0 / upload progress
        - id: LED5
          name: Edit page bit 1 / upload progress
