draft: true
Name: Punk Confusion
short-description: Punk by name, split-brain by design: Atari Punk Console synth, broken-basement PA effect, and venue-linked vocal calls
summary: |
  Punk Confusion is a deliberately confused card built around two very different
  meanings of "punk". Switch Up is a voltage-controlled Atari Punk Console-inspired
  synth voice with two timing controls, hard gate input, and nasty stepped tones.
  Switch Middle is Broken Venue, a wrecked-room audio effect for external signals:
  slapback, grit, feedback, and collapsing PA energy inspired by the cramped,
  abrasive feel of rooms like CBGB, the 100 Club, the Marquee, and the Whisky a
  Go Go. Hitting Switch Down or Pulse In 2 throws the current venue's original
  recorded punk-inspired vocal call through the same Broken Venue processing
  chain.
Language: C++ (Pico SDK / ComputerCard)
Creator: Adrian Vos + Codex
Version: "0.1.0"
Status: Draft
License: MIT
date-created: 2026-08-10
date-updated: 2026-08-12
Repository: https://github.com/TomWhitwell/Workshop_Computer/tree/main/releases/77_PunkConfusion

tags:
  - synth
  - effect
  - sample-playback
  - noise
  - lofi
  - performance

panel:
  inputs:
    - id: AudioIn1
      name: Broken Venue Input
      type: audio
      description: External audio source for the Broken Venue mode.
    - id: AudioIn2
      name: Unused
      type: audio
      description: Reserved for future expansion; unused in the first version.
    - id: CVIn1
      name: APC CV 1
      type: cv
      description: Voltage control for APC timing section 1, paired with Knob X.
    - id: CVIn2
      name: APC CV 2
      type: cv
      description: Voltage control for APC timing section 2, paired with Knob Y.
    - id: PulseIn1
      name: APC Gate
      type: pulse
      description: Hard gate for APC mode when patched. With no gate patched, the APC runs freely.
    - id: PulseIn2
      name: Vocal Trigger
      type: pulse
      description: Triggers a random built-in vocal stab, matching the Switch Down gesture.
  outputs:
    - id: AudioOut1
      name: Main Output
      type: audio
      description: Main audio output for both APC and Broken Venue modes.
    - id: AudioOut2
      name: Stereo Room Output
      type: audio
      description: Decorrelated room output for stereo patches; APC mode mirrors Audio Out 1.
    - id: CVOut1
      name: Unused
      type: cv
      description: Unused in the first version.
    - id: CVOut2
      name: Unused
      type: cv
      description: Unused in the first version.
    - id: PulseOut1
      name: Unused
      type: pulse
      description: Unused in the first version.
    - id: PulseOut2
      name: Unused
      type: pulse
      description: Unused in the first version.

controls:
  switch:
    up:
      name: Atari Punk Console
      description: Free-running APC-inspired synth voice with CV over both timing controls.
    middle:
      name: Broken Venue
      description: Fixed 50% dry/wet dirty room / PA treatment for external audio at Audio In 1 in the current hardware-test build.
    down:
      name: Vocal Stab
      description: Hold down to gate the current venue's embedded vocal call through the Broken Venue chain; release stops playback for stutters.
  knobs:
    - when: { z: up }
      main:
        name: Volume
        description: Overall APC output level.
      x:
        name: APC Pot 1
        description: Manual trigger-rate control for APC section 1, summed with CV In 1.
      y:
        name: APC Pot 2
        description: Monostable one-shot time for APC section 2, summed with CV In 2; long settings can overrun the trigger rate for stepped tones.
    - when: { z: middle }
      main:
        name: Input / Room Gain
        description: Attenuates hot modular signals below noon, sits near unity at noon, and gives gentle boost clockwise; dry/wet is fixed 50/50 for auditioning.
      x:
        name: Room
        description: Selects snapped room zones in approximate length order: Marquee, CBGB, the 100 Club, then the Whisky a Go Go.
      y:
        name: Audience
        description: Simulates audience absorption; clockwise applies strongest wet-path attenuation around 400 Hz-3 kHz, with moderate high-frequency damping.
  leds:
    - display: list
      items:
        - id: LED0
          name: APC Mode / Room Zone
          description: Indicates Switch Up APC mode; in room mode participates in venue-zone display.
        - id: LED1
          name: Broken Venue Mode
          description: Indicates Switch Middle Broken Venue mode.
        - id: LED2
          name: APC Clock / Room Zone
          description: In APC mode, blinks from the divided astable trigger clock; in room mode participates in venue-zone display.
        - id: LED3
          name: Vocal Trigger
          description: Flashes for Switch Down or Pulse In 2 vocal triggers.
        - id: LED4
          name: APC Gate / Venue Drive
          description: In APC mode, indicates gate-open state; in room mode participates in venue-zone display.
        - id: LED5
          name: Clip / Chaos
          description: Indicates aggressive signal level or internal overload.
