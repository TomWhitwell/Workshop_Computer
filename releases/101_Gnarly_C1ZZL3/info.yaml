draft: false
Name: C1ZZL3 Gnarly
short-description: >-
  Performance-focused dual-oscillator phase-distortion synth with four recipe banks, six envelope
  lanes, named sound presets, CZ patch import, and optional 8mu v2 editing.
summary: >-
  Performance-focused dual-oscillator phase-distortion synth voice with recipe wave banks, named Web MIDI
  sound presets, separate oscillator amplitude/phase-distortion/pitch envelopes,
  CZ patch import support, and an eight-knob MIDI CC performance block.
  Card 84 Cosmik C1ZZL3 offers a simpler version of the phase-distortion synth
  engine with Core 1.4 and RAD v9 firmware choices. Gnarly retains RAD's
  six-lane envelope editing and named sound-preset workflow.
  Dedicated oscillator pages provide independent base PD amounts and an
  oscillator 2 interval of -24 to +24 semitones around unison. A performance
  page controls recipe bank, ring modulation, and noise/grit.
  An alternative Gnarly_C1ZZL3_8mu.uf2 firmware retains the same sound engine and
  Web MIDI editor while adding Music Thing 8mu v2 performance and custom-envelope
  editing through eight bundled controller banks. Bank 1 provides performance
  controls, Banks 2--7 edit the six envelope lanes, and Bank 8 selects the custom
  slot and adjusts lane/master depths. Buttons use Keyboard mode: A/note 120
  selects levels, B/note 121 selects times, C/note 122 saves, and D/note 123
  reverts in banks 2--8. Only saved custom sound-preset slots are editable; factory
  envelopes remain read-only and gesture mappings are disabled.
Language: C++ (Pico SDK + ComputerCard)
Creator: Adrian Vos
Version: "Gnarly protocol v11 stable"
Status: Released
License: MIT
date-created: 2026-07-22
date-updated: 2026-10-25
Editor: web
demo-link: https://www.youtube.com/watch?v=OwlnbzgJ3Lg
uf2:
  - path: uf2/C1ZZL3_GNARLY_V11.uf2
    name: Gnarly v11
  - path: uf2/Gnarly_C1ZZL3_8mu.uf2
    name: Gnarly v11 / 8mu v2

tags:
  - synth
  - midi
  - web-midi
  - phase-distortion
  - dual-oscillator
  - 8mu
  - stable

panel:
  inputs:
    - id: AudioIn1
      name: Pitch CV
      type: audio
      description: 1V/oct pitch modulation in synth mode.
    - id: CVIn1
      name: PD CV
      type: cv
      description: Adds phase-distortion modulation to both oscillators on every edit page.
    - id: CVIn2
      name: Wave CV
      type: cv
      description: Adds recipe-slot or wave modulation to both oscillators on every edit page.
    - id: PulseIn1
      name: Unused
      type: pulse
      description: Unused in Gnarly firmware.
    - id: PulseIn2
      name: Envelope Trig
      type: pulse
      description: Triggers selected envelopes; held gates sustain or loop supported envelopes and gate-off lets the envelope complete.
  outputs:
    - id: AudioOut1
      name: Oscillator 1
      type: audio
      description: Phase-distortion oscillator 1 using Amp1, PD1, Pitch1, and oscillator 1 recipe settings.
    - id: AudioOut2
      name: Oscillator 2
      type: audio
      description: Phase-distortion oscillator 2 using Amp2, PD2, Pitch2, and oscillator 2 recipe settings.
    - id: CVOut1
      name: Off
      type: cv
      description: Held low in Gnarly firmware.
    - id: CVOut2
      name: Off
      type: cv
      description: Held low in Gnarly firmware.
    - id: PulseOut1
      name: Off
      type: pulse
      description: Held low in Gnarly firmware.
    - id: PulseOut2
      name: Off
      type: pulse
      description: Held low in Gnarly firmware.

controls:
  switch:
    up:
      name: Oscillator 2 Page
      description: Edit oscillator 2. Main sets oscillator 2 interval from -24 to +24 semitones around unison, X sets oscillator 2 phase distortion, and Y selects oscillator 2 recipe slot in the current bank.
    middle:
      name: Oscillator 1 Page
      description: Edit oscillator 1. Main sets shared pitch, X sets oscillator 1 phase distortion, and Y selects oscillator 1 recipe slot in the current bank.
    down:
      name: Performance / Bank Page
      description: Hold down to edit performance controls. Main selects recipe bank, X sets ring modulation, and Y sets noise or grit.
  knobs:
    - when:
        z: middle
      main:
        name: Shared Pitch
        description: Shared pitch for both oscillators.
      x:
        name: Oscillator 1 Phase Distortion
        description: Phase distortion amount for oscillator 1.
      y:
        name: Oscillator 1 Recipe Slot
        description: Selects oscillator 1 recipe slot in the current bank.
    - when:
        z: up
      main:
        name: Oscillator 2 Interval / Spread
        description: Oscillator 2 base interval from -24 to +24 semitones, centred at unison.
      x:
        name: Oscillator 2 Phase Distortion
        description: Phase distortion amount for oscillator 2.
      y:
        name: Oscillator 2 Recipe Slot
        description: Selects oscillator 2 recipe slot in the current bank.
    - when:
        z: down
      main:
        name: Recipe Bank
        description: Selects one of the four recipe banks.
      x:
        name: Ring Modulation
        description: Ring modulation amount.
      y:
        name: Noise / Grit
        description: Noise and grit amount.
  leds:
    - when:
        z: down
      display: list
      items:
        - id: LED0
          name: Bank 1 / 2
          description: With LED1, encodes the selected recipe bank. Both LEDs off = bank 1; LED 1 on = bank 2; LED 2 on = bank 3; both on = bank 4.
        - id: LED1
          name: Bank 1 / 2
          description: With LED0, encodes the selected recipe bank. Both LEDs off = bank 1; LED 1 on = bank 2; LED 2 on = bank 3; both on = bank 4.
        - id: LED2
          name: Oscillator 2 Interval / Spread
          description: Shows oscillator 2 interval or spread as a bipolar brightness from center.
        - id: LED3
          name: Ring Modulation
          description: Shows ring modulation amount.
        - id: LED4
          name: Noise / Grit
          description: Shows noise or grit amount.
        - id: LED5
          name: Panel Page / 8mu Edit Mode
          description: Standard firmware shows the panel page at off, medium, or full brightness. In 8mu firmware, steady on means stage levels (A); blinking twice per second means stage times (B). Startup selection and save confirmation take priority.

host:
  notes: >-
    Gnarly is a performance-focused C1ZZL3 version with dual-oscillator editing,
    four recipe banks, ring modulation, and noise/grit. Card 84 Cosmik C1ZZL3
    provides a simpler version of the phase-distortion synth engine, with Core
    1.4 and RAD v9 firmware choices. Gnarly retains RAD's six-lane envelope
    editing and named sound presets and adds independent base PD amounts
    and an oscillator 2 interval control.


    Switch middle edits oscillator 1, switch up edits oscillator 2, and
    switch down controls recipe bank, ring modulation, and noise/grit.


    Web MIDI: use the GnarlyC1zzl3 Lab for Amp1/Amp2, PD1/PD2, Pitch1/Pitch2,
    recipe bank, named sound presets, and CZ Import Lab handoff.

    Demo video note: for Core 1.4 / RAD v9, also refer to the Cosmik C1ZZL3
    demo video.


    MIDI CC map: CC1 = oscillator 1 phase distortion; CC20 = oscillator 1
    recipe slot; CC21 = oscillator 2 recipe slot; CC22 = ring modulation;
    CC23 = recipe bank; CC24 = oscillator 2 interval/spread; CC25 = oscillator
    2 phase distortion; CC26 = noise/grit; CC27 = oscillator 1 phase
    distortion for eight-knob controllers.


    Recipe banks 2--4 use fixed waveform blends. Depending on the recipe,
    the blend favours the first waveform, is equal, or favours the second.
    Bank 1 morphs between the eight plain waveform families. CV In 1
    modulates both oscillator PD amounts; CV In 2 modulates both recipe-slot
    or waveform controls on every page.


    8mu alternative: import the bundled 8mu bank files when using
    Gnarly_C1ZZL3_8mu.uf2. Buttons use Keyboard mode on MIDI channel 1 with
    velocity 127. In banks 2--8: A = note 120 (stage levels), B = note 121
    (stage times), C = note 122 (save all six lanes and current performance
    settings), D = note 123 (revert all six lanes to their saved values).
    Save/revert require a saved custom slot. Bank 1 sends notes 124--127
    for A--D respectively; these are ignored. Reserved button notes do not
    play synth pitches. Actions occur on note-on; note-off does not undo them.
    CC120--123 remain supported for other controllers. Re-import the matching
    keyboard-mode banks and choose Update controller after each import.
    Workshop Computer LED 6 is steady for stage-level editing (A) and blinks
    twice per second for stage-time editing (B). The mode carries across banks
    and defaults to levels at startup. Startup selection and save confirmation
    temporarily override the indicator.
    Keyboard-mode A/B selection, LED 6 feedback, and audible operation passed
    hardware testing on 2026-10-25.

