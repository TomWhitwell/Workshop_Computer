Name: Castle Process
draft: false
short-description: Chop external audio against internal square waves, with a separate bass pulse voice;
  inspired by the Fort Processor.
summary: Chop up drums, voices or oscillators and switch them against crude internal square
  waves. Castle Process is a harsh noise processor inspired by the Fort Processor, with
  a separate bass pulse beneath the chopped sound. It is a playable interpretation of
  the idea rather than a faithful clone or clean effect.
Language: C++ (Pico SDK + ComputerCard)
Creator: Adrian Vos
Version: "1.0"
Status: Beta
License: MIT
date-created: 2026-06-25
date-updated: 2026-06-25
demo-link: https://www.youtube.com/watch?v=iS8HaeX_z_Y
panel:
  inputs:
    - id: AudioIn1
      name: |-
        Audio
        In 1
      description: Patch audio here to chop, gate and distort it.
      type: audio
    - id: CVIn1
      name: |-
        CV
        1
      description: Internal control modulation input
      type: cv
    - id: CVIn2
      name: |-
        CV
        2
      description: Internal control modulation input
      type: cv
    - id: PulseIn1
      name: |-
        Bass
        Trigger
      description: Patch a trigger here to set the bass timing yourself, replacing the internal
        bass triggers.
      type: pulse
    - id: PulseIn2
      name: |-
        Pulse
        2
      description: Reserved for further interaction
      type: pulse
  outputs:
    - id: AudioOut1
      name: |-
        Chopped
        Output
      description: Primary chopped external-input output
      type: audio
    - id: AudioOut2
      name: |-
        Bass +
        Texture
      description: Bass-focused output with supporting noise texture
      type: audio
    - id: PulseOut1
      name: |-
        Bass
        Activity
      description: Bass activity pulse output
      type: pulse
    - id: PulseOut2
      name: |-
        Chop
        Pulse
      description: Internal chop pulse output
      type: pulse
tags:
  - harsh-noise
  - performance
  - chopped-audio
  - bass
  - lo-fi
controls:
  switch:
    up:
      name: Z mild
      description: Alternate latched mode with a little more body and more squarewave
        colour.
    middle:
      name: Z moderate
      description: Default tighter and more direct chopped mode.
    down:
      name: Z Chaos
      description: Momentary bend / chaos gesture while held for live performance accents.
  knobs:
    - main:
        name: |-
          Drive /
          Voicing
        description: Controls overall drive and voicing
      x:
        name: |-
          Chopping /
          Motion
        description: Controls chopping behaviour and motion
      y:
        name: |-
          Tuning /
          Interaction
        description: Controls tuning and internal interaction
  leds:
    - display: list
      items:
        - id: LED0
          name: LED 1
          description: LED 0 follows input presence.
        - id: LED1
          name: LED 2
          description: LED 1 follows drive.
        - id: LED2
          name: LED 3
          description: LED 2 follows chopping.
        - id: LED3
          name: LED 4
          description: LED 3 follows tuning.
        - id: LED4
          name: LED 5
          description: LED 4 reflects output level.
        - id: LED5
          name: LED 6
          description: LED 5 shows switch state, with switch down driving it fully bright.
contact:
  social:
    github: https://github.com/soveda
