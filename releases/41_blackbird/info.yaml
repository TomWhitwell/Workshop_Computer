draft: false
Name: Blackbird
short-description: "A scriptable, live-codable, USB-serial-to-CV device implementing monome crow's protocol"
Language: C++ (Pico SDK + ComputerCard) + Lua
Creator: Dune Desormeaux
Version: 1.2
Status: Released
License: GPLv3 or later
date-created: 2025-11-10
date-updated: 2026-10-22
Editor: https://dessertplanet.github.io/web-druid/
demo-link: https://youtu.be/V9HAspnpEWU

contact:
  website: https://dessertplanet.co

tags:
  - scripting
  - crow
  - cv
  - utility
  - midi
  - midi-device
  - midi-host
  - usb-host

uf2:
  - path: UF2/blackbird.1.2.release.uf2
    name: Blackbird 1.2

summary: |
  Blackbird runs crow-compatible Lua scripts over USB serial and can also store scripts on card flash.
  Panel control behavior is script-defined: Lua code reads `bb.knob.*`, `bb.switch.position`, and inputs,
  then decides how outputs respond. Scripts can send and receive USB MIDI and I2C messages for added connectivity. Version 1.2 has dramatically
  improved performance as well as addressing a bunch of requests and bugs that were reported in version 1.1.

panel:
  inputs:
    - id: CVIn1
      type: cv
      name: input[1]
      description: Script-readable CV input mapped to crow input[1]
    - id: CVIn2
      type: cv
      name: input[2]
      description: Script-readable CV input mapped to crow input[2]
    - id: AudioIn1
      type: audio
      name: bb.audioin[1]
      description: Audio input query source for Lua scripts
    - id: AudioIn2
      type: audio
      name: bb.audioin[2]
      description: Audio input query source for Lua scripts
    - id: PulseIn1
      type: pulse
      name: bb.pulsein[1]
      description: Digital input with change/clock detection for Lua callbacks
    - id: PulseIn2
      type: pulse
      name: bb.pulsein[2]
      description: Digital input with change/clock detection for Lua callbacks
  outputs:
    - id: CVOut1
      type: cv
      name: output[1]
      description: Calibrated CV output under script control
    - id: CVOut2
      type: cv
      name: output[2]
      description: Calibrated CV output under script control
    - id: AudioOut1
      type: audio
      name: output[3]
      description: Uncalibrated CV/audio output under script control
    - id: AudioOut2
      type: audio
      name: output[4]
      description: Uncalibrated CV/audio output under script control
    - id: PulseOut1
      type: pulse
      name: bb.pulseout[1]
      description: Digital pulse output for Lua-triggered actions
    - id: PulseOut2
      type: pulse
      name: bb.pulseout[2]
      description: Digital pulse output for Lua-triggered actions

controls:
  switch:
    up:
      name: position = up
      description: Three-position switch state exposed to Lua; script decides response
    middle:
      name: position = middle
      description: Three-position switch state exposed to Lua; script decides response
    down:
      name: position = down
      description: Three-position switch state exposed to Lua; script decides response
  knobs:
    - main:
        name: bb.knob.main
        description: Normalized analog knob value exposed to Lua; behavior depends on loaded script
      x:
        name: bb.knob.x
        description: Normalized analog knob value exposed to Lua; behavior depends on loaded script
      y:
        name: bb.knob.y
        description: Normalized analog knob value exposed to Lua; behavior depends on loaded script
  leds:
    - display: list
      items:
        - id: LED0
          name: output[3]
          description: Lights with Audio Out 1's positive voltage
        - id: LED1
          name: output[4]
          description: Lights with Audio Out 2's positive voltage
        - id: LED2
          name: output[1]
          description: Lights with CV Out 1's positive voltage
        - id: LED3
          name: output[2]
          description: Lights with CV Out 2's positive voltage
        - id: LED4
          name: bb.pulseout[1]
          description: On while Pulse Out 1 is high
        - id: LED5
          name: bb.pulseout[2]
          description: On while Pulse Out 2 is high

host:
  usb:
    - name: crow hosts (druid, web-druid, norns, Max for Live)
      role: serial
      description: Live code, upload scripts, or run norns and Max patches that use crow
    - name: USB MIDI device
      role: midi
      description: Connected to a computer, blackbird is also a MIDI device
    - name: USB MIDI host
      role: controller
      description: A class-compliant MIDI controller plugged into the Computer
  notes: |
    USB device or host mode is chosen at power-up: power the whole system off and on to switch.
