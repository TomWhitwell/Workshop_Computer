summary: |
  Utility Pair splits the Computer module into two halves, each running a 'utility' module to do simple but useful things with the signals in the system.
   Any pair of utilities can be combined.  Download from [chris-j.co.uk/utility_pair](https://www.chris-j.co.uk/utility_pair).

panel:
  inputs:
    - id: AudioIn1
      name: Left Audio In
      description: ""
    - id: CVIn1
      name: Left CV In
      description: ""
    - id: PulseIn1
      name: Left Pulse In
      description: ""
    - id: AudioIn2
      name: Right Audio In
      description: ""
    - id: CVIn2
      name: Right CV In
      description: ""
    - id: PulseIn2
      name: Right Pulse In
      description: ""
  outputs:
    - id: AudioOut1
      name: Left Audio Out
      description: ""
    - id: CVOut1
      name: Left CV Out
      description: ""
    - id: PulseOut1
      name: Left Pulse Out
      description: ""
    - id: AudioOut2
      name: Right Audio Outp
      description: ""
    - id: CVOut2
      name: Right CV Out
      description: ""
    - id: PulseOut2
      name: Right Pulse Out
      description: Right-side pulse output generated by selected right utility

controls:
  knobs:
    -
      main:
        name: Left Secondary Control
        description: Main knob is owned by left utility
      x:
        name: Left Primary Control
        description: X knob is owned by left utility
      y:
        name: Right Primary Control
        description: Y knob is owned by right utility
  switch:
    up:
      Right Secondary Control
   
