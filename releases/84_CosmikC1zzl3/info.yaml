summary: Stable phase-distortion synthesiser and Turing machine firmware with
  pitch-aware Web MIDI envelopes, envelope readback, PD, detune, eight waveform
  families, hosted CZ patch import, USB MIDI device/host operation, and optional
  Turing MIDI output that defaults off.
short-description: Stable phase-distortion synthesiser and Turing machine
  firmware with pitch-aware Web MIDI envelopes, envelope readback, PD, detune,
  eight waveform families, hosted CZ patch import, USB MIDI device/host
  operation, and optional Turing MIDI output that defaults off.
Language: C++ (Pico SDK)
Creator: Adrian Vos
Version: "1.4"
Status: Beta - stable in single-developer testing
License: MIT
panel:
  inputs:
    - id: AudioIn1
      name: Pitch CV
      description: 1V/oct pitch modulation in PD synth mode
      type: audio
    - id: CVIn1
      name: |-
        Phase
        Distortion
      description: Adds phase-distortion amount in synth and Turing modes
      type: cv
    - id: CVIn2
      name: |-
        Wave Control
        CV
      description: Adds wave control in synth and Turing modes
      type: cv
    - id: PulseIn1
      name: |-
        Ext Turing
        Clock
      description: External Turing clock in switch-up mode
      type: pulse
    - id: PulseIn2
      name: |-
        Envelope
        Trig
      description: Triggers selected envelope and oscillator sync in synth mode; held
        gates loop supported envelopes and gate-off lets them complete
      type: pulse
  outputs:
    - id: AudioOut1
      name: |-
        Oscillator 1
        / Turing
      description: Oscillator 1 in synth mode; self-playing stepped oscillator 1 in
        Turing mode
      type: audio
    - id: AudioOut2
      name: |-
        Oscillator 2
        / Turing
      description: Oscillator 2 in synth mode; self-playing stepped oscillator 2 in
        Turing mode
      type: audio
    - id: CVOut1
      name: |-
        Stepped
        Turing CV
      description: Scaled stepped Turing CV; continues updating in synth mode
      type: cv
    - id: CVOut2
      name: |-
        Smoothed
        Turing CV
      description: Smoothed Turing CV; continues updating in synth mode
      type: cv
    - id: PulseOut1
      name: |-
        Main Turing
        Pulse
      description: Main Turing pulse; continues updating in synth mode
      type: pulse
    - id: PulseOut2
      name: |-
        Alternate
        Turing Pulse
      description: Alternate Turing bit pulse; continues updating in synth mode
      type: pulse
tags:
  - synth
  - midi
  - web-midi
  - turing-machine
  - phase-distortion
controls:
  switch:
    up:
      name: Z up
      description: "Z up: MAIN: Mutation; X: Sequence Length; Y: Clock Speed."
    middle:
      name: Z middle
      description: "Z middle: MAIN: Pitch; X: Phase Distortion; Y: Waveform Morph."
    down:
      name: Z down
      description: "Z down, hold: MAIN: Detune; X: Ring Modulation; Y: Noise/Grit."
  knobs:
    - main:
        name: Pitch
        description: Oscillator pitch in synth mode
      x:
        name: |-
          Phase
          Distortion
        description: Phase-distortion amount
      y:
        name: |-
          Waveform
          Morph
        description: Waveform selection/morph
  leds:
    - display: list
      items:
        - id: LED0
          name: LED 1
          description: "In synth mode: LED 1 shows phase-distortion amount, LED 2 shows
            waveform position, LED 3 shows oscillator 2 level, LED 4 shows ring
            modulation amount, LED 5 shows noise amount, and LED 6 lights while
            the switch is held down."
        - id: LED1
          name: LED 2
          description: "In Turing mode: LEDs 1-3 show low bits of the Turing pattern, LED
            4 follows Pulse In 1, LED 5 shows sequence length, and LED 6 flashes
            on each Turing clock step."
        - id: LED2
          name: LED 3
          description: "In startup envelope selection: factory presets use the binary LED
            display, and custom slots light LED 6 and use LEDs 1-3 for the
            custom slot number."
host:
  notes: >
    Phase-distortion synth card with Turing machine mode, USB MIDI, browser
    editor tools, CZ Import Lab handoff, pitch envelopes, gate-held envelope
    looping, natural trigger completion, and audio smoothing for high-PD tones.

    Switch middle is PD synth mode (Main = pitch, X = phase distortion, Y =
    waveform morph). Pulse In 2 and MIDI note-on loop supported envelopes while
    held; gate/note-off lets the envelope complete naturally.

    Hold switch down from middle for performance edit (detune, ring modulation,
    noise/grit) and save.

    Switch up is Turing mode (Main = mutation, X = length, Y = clock speed).

    Turing CV and pulse outputs continue running in synth mode. Turing MIDI
    output is optional and defaults off.

    Factory envelope presets are never overwritten; custom envelopes use
    separate browser-stored slots.

    Envelope Lab edits and reads back envelopes and settings. C1ZZL3 Import Lab
    prepares translated Casio CZ drafts, including pitch envelopes, for review
    before sending them on to the card.



    Envelope Lab: Browser editor for amplitude, phase-distortion, and pitch
    envelopes, envelope readback, and performance settings.


    C1ZZL3 Import Lab: Hosted browser translator for Casio CZ `.syx` patches,
    with pitch-aware handoff into Envelope Lab for final editing and sending.


    MIDI CC1 controls phase distortion, CC20 detune, CC21 ring modulation, CC22
    noise,

    CC23 waveform, and CC24 Turing CV octave range. Turing MIDI output defaults
    off.
