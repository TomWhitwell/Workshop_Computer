Name: Cosmik C1ZZL3
draft: false
date-created: 2026-07-22
date-updated: 2026-07-24
summary: Dual phase-distortion synthesiser and Turing machine release with Core
  1.4 and alternate Rad v9 firmware. Both support USB MIDI, a shared browser
  editor and CZ patch Import Lab, optional Turing MIDI output, and Turing CV and
  pulse outputs. Rad v9 adds independently editable envelopes, pitch envelopes,
  and waveform families for both oscillators.
short-description: Core 1.4 and Rad v9 dual phase-distortion synth and Turing
  machine firmware with shared Web MIDI editing and CZ patch import.
Language: C++ (Pico SDK)
Creator: Adrian Vos
Version: "1.4"
Status: Beta - stable in single-developer testing
License: MIT
demo-link: https://www.youtube.com/watch?v=wv4BscxiBcc
uf2:
  - path: uf2/C1ZZL3_CORE.uf2
    name: Core 1.4
  - path: uf2/C1ZZL3_RAD.uf2
    name: Rad v9
panel:
  inputs:
    - id: AudioIn1
      name: Pitch CV
      description: 1V/oct pitch modulation in PD synth mode
      type: audio
    - id: CVIn1
      name: |-
        Phase
        Distortion
      description: Adds phase-distortion amount in synth and Turing modes
      type: cv
    - id: CVIn2
      name: |-
        Wave Control
        CV
      description: Adds wave control in synth and Turing modes
      type: cv
    - id: PulseIn1
      name: |-
        Ext Turing
        Clock
      description: External Turing clock in switch-up mode
      type: pulse
    - id: PulseIn2
      name: |-
        Envelope
        Trig
      description: Triggers selected envelope and oscillator sync in synth mode; held
        gates loop supported envelopes and gate-off lets them complete
      type: pulse
  outputs:
    - id: AudioOut1
      name: |-
        Oscillator 1
        / Turing
      description: Oscillator 1 in synth mode; self-playing stepped oscillator 1 in
        Turing mode
      type: audio
    - id: AudioOut2
      name: |-
        Oscillator 2
        / Turing
      description: Oscillator 2 in synth mode; self-playing stepped oscillator 2 in
        Turing mode
      type: audio
    - id: CVOut1
      name: |-
        Stepped
        Turing CV
      description: Scaled stepped Turing CV; continues updating in synth mode
      type: cv
    - id: CVOut2
      name: |-
        Smoothed
        Turing CV
      description: Smoothed Turing CV; continues updating in synth mode
      type: cv
    - id: PulseOut1
      name: |-
        Main Turing
        Pulse
      description: Main Turing pulse; continues updating in synth mode
      type: pulse
    - id: PulseOut2
      name: |-
        Alternate
        Turing Pulse
      description: Alternate Turing bit pulse; continues updating in synth mode
      type: pulse
tags:
  - synth
