Name: QiGong Timer
short-description: Interval meditation timer that strikes your own chime and bell, with reverb, delay and true silence between.
summary: |
  An interval timer for Qi Gong or any practice, set by touch: **Main** = number of intervals (1-36), **X** = minutes (0-36),
  **Y** = extra seconds (0-60), each step a soft click, the LEDs show the numbers. After a 10 s settling period a **double chime**
  starts the session; **Pulse Out 1** strikes your patched chime at the end of every interval and **Pulse Out 2** your bell at the
  end. Two separate reverb + delay chains (In 1 to Out 1, In 2 to Out 2), and complete silence between the strikes, even when your
  filters leak. Tap to start or pause, hold 3 s to stop, triple-tap for a preview mode to tune and dial in your sounds.
Language: C++ (Pico SDK + ComputerCard)
Creator: Joe Hedinger (isbn)
Version: "0.9.0"
Status: Beta
License: MIT
date-created: 2026-10-07
date-updated: 2026-10-19

tags:
  - utility
  - trigger
  - effect
  - reverb
  - delay

uf2:
  - path: UF2/qigong_timer.0.9.0.uf2
    name: QiGong Timer 0.9.0

panel:
  inputs:
    - id: AudioIn1
      name: Interval Chime
      type: audio
      description: Your patched chime voice (struck by Pulse Out 1). Passed to Out 1 with its own reverb and delay.
    - id: AudioIn2
      name: End Bell
      type: audio
      description: Your patched bell or gong voice (struck by Pulse Out 2). Passed to Out 2 with its own reverb and delay.
  outputs:
    - id: AudioOut1
      name: Chime Out
      type: audio
      description: The chime with its reverb and delay; silent between strikes.
    - id: AudioOut2
      name: Bell Out
      type: audio
      description: The bell with its reverb and delay; silent between strikes.
    - id: PulseOut1
      name: Chime Strike
      type: pulse
      description: 100 ms pulse to the chime's Slope (Falling mode). Twice at the start (0.6 s apart), then at the end of every interval but the last; also in preview mode.
    - id: PulseOut2
      name: Bell Strike
      type: pulse
      description: 100 ms pulse to the bell's Slope (Falling mode) at the end of the session; also in preview mode.
    - id: CVOut1
      name: Unused (0 V)
      type: cv
    - id: CVOut2
      name: Unused (0 V)
      type: cv

controls:
  switch:
    up:
      name: Set Timer
      description: While stopped, Main / X / Y set intervals, minutes and seconds (soft clicks, LED numbers). Ignored during a session.
    middle:
      name: Play / Effects
      description: Normal position. Main chooses an effect page (fully anticlockwise reverb, 12 o'clock mix, fully clockwise delay); X and Y adjust it.
    down:
      name: Stop
      description: Hold 3 s to stop the session (the LEDs fill up from 0.8 s; let go earlier to cancel). Hold 3 s in preview mode to leave it.
    tap:
      name: Start / Pause / Preview
      description: Tap to start (10 s settling, then the double chime), tap again to pause or resume. Triple-tap while stopped for preview mode; one tap ends it. Taps act 0.4 s after release.

  knobs:
    - when: { z: up }
      main:
        name: Intervals
        description: Number of intervals, 1-36 (low click per step)
      x:
        name: Minutes
        description: Minutes per interval, 0-36 (middle click per step; 0 = seconds only)
      y:
        name: Seconds
        description: Extra seconds per interval, 0-60 in tens (high click per step); 0 min + 0 s counts as 10 s
    - when: { z: middle }
      main:
        name: Effect Page
        description: Fully anticlockwise = reverb, 12 o'clock = mix, fully clockwise = delay; elsewhere nothing changes
      x:
        name: Reverb Time / Reverb Level / Echo Time
        description: "Reverb page: decay 1-25 s. Mix page: reverb level. Delay page: echo time 60 ms - 1 s. Soft pickup."
      y:
        name: Brightness / Delay Level / Feedback
        description: "Reverb page: brightness. Mix page: delay level. Delay page: feedback 0-93%. Soft pickup."

  leds:
    - display: list
      items:
        - id: LED0
          name: Status display (all six)
          description: "Ready: all six breathe dimly. Settling: count down. Running: a dim bar fills over the session. Paused: the bar blinks. Each strike: a soft flash. End: all glow and fade."
    - when: { z: up }
      display: list
      items:
        - id: LED0
          name: Number display (all six)
          description: "The value of the knob touched last. 1-6 = medium LEDs; above 6 each bright LED = a six, plus a blinking bright LED (+1 to +6) or medium LEDs for the rest. Seconds: one medium LED per 10 s."
    - when: { z: middle }
      display: list
      items:
        - id: LED0
          name: Effect page / value
          description: "Arriving on a page: top row = reverb, middle row = mix, bottom row = delay. Touching X or Y: a bar of that setting, flickering until the knob has caught it."
