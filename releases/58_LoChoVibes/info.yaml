Name: LoCho Vibes
draft: false
date-created: 2026-06-14
date-updated: 2026-07-09
summary: Add stereo chorus, gentle tape wobble or seasick vibrato. Choose triangle, sine or
  slow drift LFO movement to modulate the delay, then add tape-style saturation.
short-description: Stereo lo-fi chorus and vibrato with triangle, sine or wandering LFO movement and
  tape-style saturation.
Language: C++ (Pico SDK + ComputerCard)
Creator: Adrian Vos
Version: 0.1.0
Status: Beta
License: MIT
demo-link: https://www.youtube.com/watch?v=rggZFG6SX6M
panel:
  inputs:
    - id: AudioIn1
      name: |-
        Audio In
        Left
      description: Left input channel; summed with AudioIn2 to mono before stereo
        modulation processing
      type: audio
    - id: AudioIn2
      name: |-
        Audio In
        Right
      description: Right input channel; summed with AudioIn1 to mono before stereo
        modulation processing
      type: audio
    - id: CVIn1
      name: Depth Mod
      description: Bipolar CV modulation for X depth control
      type: cv
    - id: CVIn2
      name: |-
        Character
        Mod
      description: Bipolar CV modulation for Y Character control
      type: cv
    - id: PulseIn1
      name: |-
        Ext LFO
        Clock
      description: Rising edges sync LFO timing to external pulse source with internal
        fallback when pulses stop
      type: pulse
  outputs:
    - id: AudioOut1
      name: |-
        Audio Out
        Left
      description: Left processed output
      type: audio
    - id: AudioOut2
      name: |-
        Audio Out
        Right
      description: Right processed output
      type: audio
    - id: CVOut1
      name: LFO CV
      description: Main internal LFO waveform as CV
      type: cv
    - id: CVOut2
      name: |-
        Inverted LFO
        CV
      description: Inverted version of the internal LFO waveform
      type: cv
tags: []
controls:
  switch:
    up:
      name: Vibrato
      description: "Z up: Vibrato mode."
    middle:
      name: Chorus
      description: "Z middle: Chorus mode."
    down:
      name: Change LFO shape
      description: "Z down, momentary: LFO Shape Select."
  knobs:
    - main:
        name: Mod Rate
        description: LFO speed for chorus/vibrato movement
      x:
        name: Mod Depth
        description: LFO pitch/modulation depth amount
      y:
        name: Character
        description: Bipolar character shaping from lo-fi degradation to
          compression/saturation coloration
  leds:
    - display: list
      items:
        - id: LED0
          name: LED 1
          description: LED 1 follows clock / rate indication.
        - id: LED1
          name: LED 2
          description: LED 2 follows modulation activity and depth.
        - id: LED2
          name: LED 3
          description: LED 3 follows lo-fi amount.
        - id: LED3
          name: LED 4
          description: LED 4 follows compression amount.
        - id: LED4
          name: LED 5
          description: LED 5 follows shape animation A.
        - id: LED5
          name: LED 6
          description: LED 6 follows shape animation B.
        - id: LED6
          name: LED 7
          description: When the switch is tapped down, LEDs 1-2 show triangle, LEDs 3-4
            show sine, and LEDs 5-6 show random drift.
host:
  notes: Main sets modulation rate, X sets depth and Y sets Character, moving from lo-fi
    degradation to compression coloration. Switch Up selects fully wet vibrato; Middle
    blends dry and wet sound for chorus. Tap Down to cycle through triangle, sine and
    random drift LFO shapes. The LFO can follow an external clock.
contact:
  social:
    github: https://github.com/soveda
