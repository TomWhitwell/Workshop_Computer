Name: LoCho Vibes
draft: false
date-created: 2026-06-14
date-updated: 2026-07-09
summary: Stereo chorus and vibrato effect featuring triangle, sine, and slow
  drift LFO modes, modulation-based delay movement, and tape-style saturation.
short-description: Stereo chorus and vibrato effect featuring triangle, sine,
  and slow drift LFO modes, modulation-based delay movement, and tape-style
  saturation.
Language: C++
Creator: Adrian Vos
Version: 0.1.0
Status: Beta - stable in single-developer testing
License: MIT
panel:
  inputs:
    - id: AudioIn1
      name: |-
        Audio In
        Left
      description: Left input channel; summed with AudioIn2 to mono before stereo
        modulation processing
      type: audio
    - id: AudioIn2
      name: |-
        Audio In
        Right
      description: Right input channel; summed with AudioIn1 to mono before stereo
        modulation processing
      type: audio
    - id: CVIn1
      name: Depth Mod
      description: Bipolar CV modulation for X depth control
      type: cv
    - id: CVIn2
      name: |-
        Character
        Mod
      description: Bipolar CV modulation for Y Character control
      type: cv
    - id: PulseIn1
      name: |-
        Ext LFO
        Clock
      description: Rising edges sync LFO timing to external pulse source with internal
        fallback when pulses stop
      type: pulse
  outputs:
    - id: AudioOut1
      name: |-
        Audio Out
        Left
      description: Left processed output
      type: audio
    - id: AudioOut2
      name: |-
        Audio Out
        Right
      description: Right processed output
      type: audio
    - id: CVOut1
      name: LFO CV
      description: Main internal LFO waveform as CV
      type: cv
    - id: CVOut2
      name: |-
        Inverted LFO
        CV
      description: Inverted version of the internal LFO waveform
      type: cv
tags: []
controls:
  switch:
    up:
      name: Z up
      description: Vibrato mode.
    middle:
      name: Z middle
      description: Chorus mode.
    down:
      name: Z down
      description: Momentary LFO shape select.
  knobs:
    - main:
        name: Mod Rate
        description: LFO speed for chorus/vibrato movement
      x:
        name: Mod Depth
        description: LFO pitch/modulation depth amount
      y:
        name: Character
        description: Bipolar character shaping from lo-fi degradation to
          compression/saturation coloration
  leds:
    - display: list
      items:
        - id: LED0
          name: LED 1
          description: LED 1 follows clock / rate indication.
        - id: LED1
          name: LED 2
          description: LED 2 follows modulation activity and depth.
        - id: LED2
          name: LED 3
          description: LED 3 follows lo-fi amount.
        - id: LED3
          name: LED 4
          description: LED 4 follows compression amount.
        - id: LED4
          name: LED 5
          description: LED 5 follows shape animation A.
        - id: LED5
          name: LED 6
          description: LED 6 follows shape animation B.
        - id: LED6
          name: LED 7
          description: When the switch is tapped down, LEDs 1-2 show triangle, LEDs 3-4
            show sine, and LEDs 5-6 show random drift.
host:
  notes: >
    Stereo lo-fi chorus/vibrato with clockable LFO and character shaping.

    Main controls modulation rate, X controls modulation depth, Y controls
    Character

    (lo-fi degradation <-> compression coloration). Switch up selects vibrato
    mode

    (fully wet), middle selects chorus mode (dry/wet blend), and a momentary
    move

    to down cycles LFO shape (triangle, sine, random drift).
contact:
  social:
    github: https://github.com/soveda
