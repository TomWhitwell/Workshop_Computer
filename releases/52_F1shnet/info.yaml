readme: |
  # F1shnet

  A fishy FSH-1-inspired filter/sample-hold effect card for the Music Thing Modular Workshop Computer.

  This version is an interpretation rather than a verified clone. It focuses on the core idea shared by the Maestro FSH-1 and recent descendants: a low-pass filter moved either by your playing dynamics or by random stepped voltages.

  ## Modes

  - **Up**: Alternate control page
  - **Middle**: Main control page
  - **Down (held)**: Sample and hold gesture

  ## Controls

  - **Middle**: Main = filter range, X = envelope/S&H depth, Y = resonance.
  - **Up**: Main = output trim, X = envelope sensitivity, Y = envelope decay.
  - **Down (held)**: Main = internal S&H clock speed with soft pickup.

  ## Performance patching

  - Patch **Pulse In 1** as an external retrigger / clock.
  - Patch **Pulse In 2** to force the sample-and-hold gesture high without touching the switch.
  - **CV Out 1** is always the stepped S&H voltage and **CV Out 2** is always the envelope follower, so both can patch elsewhere even when the audio voice is doing something different.
  - **CV In 2** modulates depth strongly enough to be audible: positive CV widens the sweep and negative CV narrows it.

panel:
  inputs:
    - id: AudioIn1
      name: Audio In
      description: Main mono audio input to the filter engine.
      type: audio
    - id: AudioIn2
      name: Audio Mod In
      description: Secondary audio-rate control input used as extra parameter modulation.
      type: audio
    - id: CVIn1
      name: CV 1
      description: Consistent modulation for filter range and envelope sensitivity in all switch positions.
      type: cv
    - id: CVIn2
      name: CV 2
      description: Consistent modulation for depth; positive CV widens the envelope/S&H sweep, negative CV makes it shallower.
      type: cv
    - id: PulseIn1
      name: Clock
      description: External retrigger / clock input. Forces a new random step in sample-and-hold mode.
      type: pulse
    - id: PulseIn2
      name: S&H Gate
      description: Qualified gate input that forces the sample-and-hold gesture high while held after a real low-to-high gate.
      type: pulse
  outputs:
    - id: AudioOut1
      name: LP Up / Ping Out
      description: Fully wet envelope-up low-pass output; transients open the filter upward. During S&H gesture this is the left side of the ping-pong S&H low-pass voice.
      type: audio
    - id: AudioOut2
      name: LP Down / Pong Out
      description: Fully wet envelope-down low-pass output; transients close the filter from the stored range. During S&H gesture this is the right side of the ping-pong S&H low-pass voice.
      type: audio
    - id: CVOut1
      name: S&H CV
      description: Stepped sample-and-hold control voltage, always available as a utility output.
      type: cv
    - id: CVOut2
      name: Envelope CV
      description: Envelope follower control voltage, always available as a utility output.
      type: cv
    - id: PulseOut1
      name: Clock Mirror
      description: Mirrors Pulse In 1.
      type: pulse
    - id: PulseOut2
      name: Sample Trigger
      description: Divided sample trigger pulse fired once for every four newly sampled random steps.
      type: pulse

controls:
  knobs:
    - main:
        name: Main
        description: Controls the primary parameter for the active page.
      x:
        name: X
        description: Controls the second parameter for the active page.
      y:
        name: Y
        description: Controls the third parameter for the active page.
    - when: { z: middle }
      main:
        name: Filter Range
        description: Base filter range / cutoff area.
      x:
        name: Depth
        description: Main filter modulation depth.
      y:
        name: Resonance
        description: Resonance emphasis for the core filter voice.
    - when: { z: up }
      main:
        name: Output Trim
        description: Post-filter output level trim for taming hot modular signals before the output clips; it is not an input attenuator and does not change envelope sensitivity; stored startup value is minimum trim.
      x:
        name: Envelope Sensitivity
        description: Input sensitivity for synth dynamics.
      y:
        name: Envelope Decay
        description: Envelope decay in normal play; minimum is longest, maximum is shortest.
    - when: { z: down }
      main:
        name: S&H Speed
        description: Live internal sample-and-hold clock speed while the momentary down gesture is held; uses soft pickup; minimum is slowest, maximum is fastest.
  switch:
    up:
      name: Alt Page
      description: Switches the knobs to the alternate control page without changing the core filter voice; knobs use soft pickup.
    middle:
      name: Main Page
      description: Default control page for the core filter voice; knobs use soft pickup when returning from the alternate page.
    down:
      name: Sample Hold Gesture
      description: Hold the spring-loaded down position to replace the envelope with random stepped filter movement; Main controls S&H clock speed while down is held.
  leds:
    - display: list
      items:
        - id: LED0
          name: Alt Page
          description: Lit when the alternate control page is active.
        - id: LED1
          name: Main
          description: Brightness follows Main; while Down is held it follows Down-Main S&H speed.
        - id: LED2
          name: S&H Gesture
          description: Lit while the sample-and-hold gesture is active from the switch or Pulse In 2.
        - id: LED3
          name: X
          description: Brightness follows the X knob position.
        - id: LED4
          name: Main Page
          description: Lit when the main control page is active.
        - id: LED5
          name: Y
          description: Brightness follows the Y knob position.

host:
  notes: |
    No USB host or device features are used in this version.
