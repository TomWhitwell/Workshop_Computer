panel:
  inputs:
    - id: AudioIn1
      name: Audio In
      type: audio
      description: Always acts on sound. Depending on the patch it is processed by an effect, excites a plucked string, ring-modulates or gates a voice, drives an envelope follower, or secretly modulates a parameter by its loudness. Unplugged, the patch uses internal sources instead.
    - id: AudioIn2
      name: Audio In
      type: audio
      description: As Audio In 1, with its own independent role.
    - id: CVIn1
      name: CV In
      type: cv
      description: Bends one or two internal settings, like a voltage-controlled knob. Can reach voices, CV and rhythm generators, or tempo. Does nothing when unplugged.
    - id: CVIn2
      name: CV In
      type: cv
      description: As CV In 1, with its own destinations.
    - id: PulseIn1
      name: Pulse In
      type: pulse
      description: Each rising edge does one job, chosen per patch. It may replace the internal clock (most often on this jack), or reset, trigger, reroll or sample-and-hold part of the patch. Does nothing when unplugged.
    - id: PulseIn2
      name: Pulse In
      type: pulse
      description: As Pulse In 1. Occasionally the clock input, more often a reset, trigger, reroll or sample-and-hold.
  outputs:
    - id: AudioOut1
      name: Voice / Effect 1
      type: audio
      description: One of a synth voice, FM, plucked string, filtered noise, bytebeat, wavefolder, granular, tape delay or ring modulator. Drone or rhythmic. Level is set automatically when the patch is built.
    - id: AudioOut2
      name: Voice / Effect 2
      type: audio
      description: A second, independent choice from the same set. Sometimes it processes Voice 1.
    - id: CVOut1
      name: CV Generator 1
      type: cv
      description: One of a step sequencer or Turing machine (quantised to the patch's scale, calibrated 1V/oct), LFO, smooth random, Lorenz chaos, envelope, or envelope follower. Often plays the same melody as one of the voices.
    - id: CVOut2
      name: CV Generator 2
      type: cv
      description: A second, independent CV generator from the same set.
    - id: PulseOut1
      name: Rhythm 1
      type: pulse
      description: One of a clock divider, Euclidean pattern, probability gate, burst generator, comparator, or additive grouping (such as 3+3+2). Often secretly triggers a voice or sequence too.
    - id: PulseOut2
      name: Rhythm 2
      type: pulse
      description: A second rhythm generator, steered toward a different clock from Rhythm 1 so the two pull against each other.

controls:
  switch:
    middle:
      name: Play
      description: Normal running.
    up:
      name: Play (reserved)
      description: Same as middle. Reserved for saving patches in a future version.
    down:
      name: Mutate
      description: Hold for about 0.6 s to mutate the current system. It keeps its character, with 2–3 things changed (a resting point, an internal connection, the scale, the tempo, a sequence or waveform).
    tap:
      name: New Patch
      description: Briefly press and release to discard the current system and build a new one. About half a second of measuring, then it fades in. The old patch is gone for good.
  knobs:
    - main:
        name: Variable 1
        description: Moves internal settings on two of the six outputs, sometimes plus tempo. No effect at 12 o'clock, so start there and sweep both ways.
      x:
        name: Variable 2
        description: Moves internal settings on two other outputs, sometimes plus tempo. Neutral at 12 o'clock.
      y:
        name: Variable 3
        description: Moves internal settings on the remaining two outputs, sometimes plus tempo. Neutral at 12 o'clock. Between them the three knobs always reach every output.
  leds:
    - display: list
      items:
        - id: LED0
          name: Audio 1 level
          description: Brightness follows the level of Audio Out 1.
        - id: LED1
          name: Audio 2 level
          description: Brightness follows the level of Audio Out 2.
        - id: LED2
          name: CV 1 voltage
          description: Off at about -5 V, half at 0 V, full at about +5 V.
        - id: LED3
          name: CV 2 voltage
          description: As LED 2, for CV Out 2.
        - id: LED4
          name: Rhythm 1
          description: Flashes on each pulse from Pulse Out 1.
        - id: LED5
          name: Rhythm 2
          description: Flashes on each pulse from Pulse Out 2.

readme: |
  # BlackBox

  Every press of **Z** builds a new system with sealed workings. You learn what it does by varying
  its inputs and observing its outputs.

  ## Best starter setup

  Two quick passes let you hear every output. Leave all six inputs empty and set Main, X and Y to
  12 o'clock. Knobs only add or subtract from a patch's resting point, so noon is neutral.

  **Pass 1: audio and CV**

  | From | To |
  |---|---|
  | Audio Out 1 | Mixer channel 1 |
  | Audio Out 2 | Mixer channel 2 |
  | CV Out 1 | Oscillator 1 pitch, oscillator 1 to mixer channel 3 |
  | CV Out 2 | Oscillator 2 pitch, oscillator 2 to mixer channel 4 |

  Set both oscillators' pitch knobs mid-range, because the CV can swing a long way up or down.

  **Pass 2: pulses**

  Unplug the oscillators from mixer channels 3 and 4, and patch the pulse outputs in instead:

  | From | To |
  |---|---|
  | Pulse Out 1 | Mixer channel 3 |
  | Pulse Out 2 | Mixer channel 4 |

  The pulses come through as clicks, so you can hear the two rhythms against each other. Start with
  those faders low, because pulses are much louder than audio. You can also just watch the bottom
  row of LEDs, which flash on each pulse.

  **Tap Z.** After about half a second the new patch fades in.

  ## Observing a system

  1. **Watch the LEDs for a few seconds.** Top row is audio level, middle row is CV voltage, bottom
     row is rhythm.
  2. **Listen to each audio output on its own.** Is it pitched or noisy, a drone or rhythmic? Does it
     line up with one of the rhythm LEDs? Voices are often secretly triggered by the rhythms.
  3. **Listen to the CV oscillators.** A melody means a sequencer or Turing machine. A siren or
     vibrato means an LFO. Wandering means random or chaos. A swoop up and back down on each hit
     means an envelope.
  4. **Sweep one knob at a time**, slowly, across its full range, then back to noon. Each knob
     reaches two outputs, and tempo is a common extra, so listen to everything.
  5. **Bring inputs in, starting with self-patching**, because a signal you already know makes the
     effect easy to read:
     - Pulse Out 1 → Pulse In 1, then Pulse Out 2 → Pulse In 2. Does the whole patch lock to
       that rhythm (it's the clock), or does something reset, jump, freeze or change on the beat?
     - CV Out 1 → CV In 1, and CV Out 2 → CV In 2. Which sound or rhythm starts to move?
     - Audio Out 1 → Audio In 2. Is it processed, does it excite a string, or does it gate or
       ring-modulate a voice? Watch your levels, as this can feed back.

     Then swap in your own modules.
  6. **Hold Z (about 0.6 s)** to mutate a patch you like. A tap discards it for good.

  ## What each jack can be

  - **Audio outs:** synth voice (detuned saws and pulse, resonant filter), FM, plucked string,
    filtered noise (white, crackle, velvet, stepped), bytebeat, wavefolder, granular, tape delay,
    ring modulator. Effects make their own source material when their audio input is empty.
  - **CV outs:** step sequencer or Turing machine (quantised to one of nine scales, 1V/oct), LFO
    (five shapes), smooth random, Lorenz chaos, attack-decay envelope, envelope follower.
  - **Pulse outs:** clock divider, Euclidean pattern, probability gate, bursts, comparator (fires
    as a CV crosses a threshold), additive groupings such as 3+2 or 3+3+2.
  - **Clocks:** a master clock (about 2–13 ticks a second) and a second clock at a related ratio
    (2:3, 3:4, 5:4 and others), sometimes swung. Rhythms and voices run from either clock or from
    each other, so the outputs don't all move together.
  - **Pulse ins:** clock, reset, trigger (on a grain or delay: freeze), reroll, or sample-and-hold
    of a CV output.
  - **CV ins:** one or two internal settings each, anywhere in the patch, including tempo.
  - **Audio ins:** processed by an effect, excite a plucked string, ring-modulate or gate a
    voice, drive an envelope follower, or modulate a parameter by loudness.

  ## Good to know

  - Every patch is levelled automatically when it's built: it measures for about half a second
    before fading in, then refines for about 8 seconds and locks. After that, your knob moves
    change the level as they should.
  - Nothing is saved. If you love a patch, record it or mutate it rather than tapping Z.
  - Built for 200 MHz (the arduino-pico default). If building from source, keep Tools → CPU
    Speed at 200 MHz.
