Name: BlackBox
short-description: A sealed system of audio, voltages and pulses, freshly generated by each press of Z. Vary its inputs and observe its outputs to learn what it does.
summary: |
  *It is not necessary to enter the black box to understand the nature of the function it
  performs.* (Stafford Beer)

  Each time Z is pressed, the card builds a new system: voices,
  voltages, rhythms and the connections between them. Its workings stay sealed. What remains open are its inputs, its outputs and its behaviour. Vary an input, observe what changes, and repeat until the behaviour makes sense. Each system is unique and impermanent; press Z again and there is a new one to understand.
Language: C++ (ComputerCard, Arduino / arduino-pico)
Creator: James Saunders
Version: "0.9.0"
Status: Beta
date-created: 2026-09-27
date-updated: 2026-09-27
tags:
