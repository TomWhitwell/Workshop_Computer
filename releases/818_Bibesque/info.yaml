draft: false
Name: Bib
short-description: Original Bib block-DSP stereo dub delay, reverb, shimmer, and tape processor.
summary: >-
  A hardware-tested beta Workshop Computer port of Plinky Synth's Bib. It runs
  the original 64-frame fixed-point DSP with stereo delay, rhythmic multitap,
  modulated reverb, shimmer, clock divisions, and tape transport controls.
Language: C++ (Pico SDK)
Creator: Adrian Vos
Version: "1.1.0-beta"
Status: Beta - hardware-tested
License: MIT
date-updated: 2026-09-18
repository: https://github.com/soveda/workshop-buddies
tags:
  - effect
  - delay
  - reverb
  - stereo
  - tape
  - clocked
uf2:
  - path: uf2/Bib-1.1.0-beta.uf2
    name: Bib 1.1.0 beta
panel:
  inputs:
    - id: AudioIn1
      name: Left Audio
      type: audio
      description: Left input for stereo processing.
    - id: AudioIn2
      name: Right Audio
      type: audio
      description: Independent right input for stereo processing.
    - id: CVIn1
      name: X Mod
      type: cv
      description: Bipolar modulation of the active X control after pickup.
    - id: CVIn2
      name: Y Mod
      type: cv
      description: Bipolar modulation of the active Y control after pickup.
    - id: PulseIn1
      name: Delay Clock
      type: pulse
      description: Clock input for Bib-style delay-time divisions.
  outputs:
    - id: AudioOut1
      name: Left Out
      type: audio
      description: Processed left output.
    - id: AudioOut2
      name: Right Out
      type: audio
      description: Processed right output.
controls:
  switch:
    up:
      name: Detail Page
      description: Delay tape transport/wobble or retained reverb shimmer.
    middle:
      name: Main Controls
      description: Normal Drive, Delay, Reverb, and Mix page controls.
    down:
      name: Page Action
      description: Toggle wavefold, record delay taps, or hold dub feedback by page.
  knobs:
    - main:
        name: Page
        description: Selects Drive, Delay, Reverb, or Mix.
      x:
        name: X
        description: Active-page X parameter, modulated by CV In 1.
      y:
        name: Y
        description: Active-page Y parameter, modulated by CV In 2.
    - when: { z: up }
      x:
        name: Detail X
        description: Tape speed on Delay; retained shimmer amount on Reverb.
      y:
        name: Detail Y
        description: Tape wobble on Delay; inactive on Reverb.
  leds:
    - display: list
      items:
        - id: LED0
          name: Page Bit 0
          description: Binary Main-page indicator.
        - id: LED1
          name: Page Bit 1
          description: Binary Main-page indicator.
        - id: LED2
          name: X Value
          description: Effective X value, including CV.
        - id: LED3
          name: Y Value
          description: Effective Y value, including CV.
        - id: LED4
          name: Page State A
          description: Wavefold, clock lock, shimmer, or dub hold by page.
        - id: LED5
          name: Page State B
          description: Ping-pong, multitap count, mix, or output level by page.
host:
  notes: >-
    Original Bib DSP is adapted from the public Buddies repository. The
    Workshop runtime is a custom DMA block-audio implementation and does not
    use ComputerCard.h.
contact:
  social:
    github: https://github.com/soveda
