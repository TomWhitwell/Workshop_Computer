<style>
:root {
  --ground: #ffffff; --ink: #1a1a1a; --soft: #5f5f5f; --line: #dcdcdc; --panel: #f5f5f3; --btn: #1a1a1a; --btnink: #ffffff;
  --off: #e6e6e3; --led: #ff4b33; --ok: #1f8a52;
  --serif: Newsreader, Georgia, "Times New Roman", serif; --sans: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
:root { --chap: var(--soft); --tickc: var(--ink); --tipedge: transparent; --rule: var(--ink); --readc: var(--ink);
  --w1: var(--ink); --w2: var(--ink); --w3: var(--ink); --w4: var(--ink); }
/* Colours: Fun (the default, owner 23 Oct), Auto (follows the computer), Light, Dark.  The choice is remembered by the browser. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) { --ground: #141414; --ink: #f2f2f0; --soft: #a9a9a5; --line: #3a3a3a; --panel: #1e1e1e; --btn: #f2f2f0; --btnink: #141414; --off: #2c2c2c; --ok: #4cc287; color-scheme: dark; }
}
:root[data-theme="dark"] { --ground: #141414; --ink: #f2f2f0; --soft: #a9a9a5; --line: #3a3a3a; --panel: #1e1e1e; --btn: #f2f2f0; --btnink: #141414; --off: #2c2c2c; --ok: #4cc287; color-scheme: dark; }
/* Fun (inspired by circuit bending): a dark circuit board with a few neon wires.  Text stays plain and readable; colour only for accents. */
:root[data-theme="fun"] {
  --ground: #0c1310; --ink: #ecfbf1; --soft: #9fbcab; --line: #26392f; --panel: #132019; --btn: #3dff8f; --btnink: #05110a;
  --off: #1d2c25; --led: #ff4fae; --ok: #3dff8f; color-scheme: dark;
  --chap: #39dcff; --tickc: #3dff8f; --tipedge: #ff4fae; --readc: #ffd84a;
  --rule: linear-gradient(90deg, #3dff8f, #39dcff 50%, #ff4fae);
  --w1: #3dff8f; --w2: #39dcff; --w3: #ff4fae; --w4: #ffd84a;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); }
body { min-height: 100vh; display: flex; flex-direction: column; }
button { font: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #2f6fdb; outline-offset: 3px; }
a { color: var(--soft); } a:hover { color: var(--ink); }

header { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; padding: 18px 28px; border-bottom: 2px solid transparent; border-image: var(--rule) 1; }
.back { justify-self: start; min-height: 44px; padding: 0 16px; background: transparent; color: var(--soft); border: 1.5px solid var(--line); border-radius: 6px; cursor: pointer; }
.back[hidden] { display: inline-block; visibility: hidden; }   /* (keeps its place: with display none, the title slid into the left slot - owner, 23 Oct) */
.brand { text-align: center; }
.brand h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 32px; letter-spacing: -0.3px; line-height: 1.1; }
.brand .name { display: block; margin-top: 2px; font-size: 16px; font-weight: 500; color: var(--soft); min-height: 1.3em; }
.conn { justify-self: end; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--soft); text-align: right; }
.conn .dot { width: 9px; height: 9px; border-radius: 50%; background: #b0b0ac; flex: none; }
.conn.on .dot { background: var(--ok); }

.top { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 24px 0; }
.face { display: grid; grid-template-columns: repeat(3, 16px); gap: 12px 14px; padding: 14px 18px; border: 1.5px solid var(--line); border-radius: 10px; }
.face span { width: 16px; height: 16px; border-radius: 50%; background: var(--off); position: relative; }
.face span::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--led); box-shadow: 0 0 10px var(--led); opacity: var(--b, 0); }
.bar { display: flex; gap: 6px; width: min(360px, 80vw); }
.bar span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.bar span.done { background: var(--w1); }
.bar span.done:nth-child(4n+2) { background: var(--w2); } .bar span.done:nth-child(4n+3) { background: var(--w3); } .bar span.done:nth-child(4n) { background: var(--w4); }
.where { margin: 0; font-size: 14px; color: var(--soft); text-align: center; }

main { flex: 1; display: flex; justify-content: center; padding: 28px 24px 16px; }
.stage { width: 100%; max-width: 640px; text-align: center; }
.screen { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.screen.out { animation: out 200ms ease-in forwards; }
.screen.in { animation: in 250ms ease-out both; }
@keyframes out { to { opacity: 0; transform: translateY(-4px); } }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 38px; line-height: 1.2; letter-spacing: -0.3px; text-wrap: balance; }
h1.big { font-size: 44px; }
.say { margin: 0; font-size: 19px; line-height: 1.55; color: var(--soft); max-width: 38ch; text-wrap: pretty; }
.chapter { margin: 0; font-size: 14px; font-weight: 500; color: var(--chap); }
.tick { margin: 0; font-size: 18px; font-weight: 600; color: var(--tickc); animation: in 200ms ease-out both; }
.waiting { margin: 0; font-size: 17px; color: var(--soft); }
.tip { margin: 0; padding: 16px 20px; max-width: 42ch; font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--panel); border-radius: 8px; border-left: 3px solid var(--tipedge); text-align: left; animation: in 200ms ease-out both; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.primary, .secondary { min-height: 52px; min-width: 140px; padding: 0 28px; border-radius: 6px; cursor: pointer; font-size: 17px; }
.primary { background: var(--btn); color: var(--btnink); border: 0; font-weight: 600; }
.secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-weight: 500; }
.next { margin-top: 28px; }
input.nameIn { width: min(340px, 80vw); min-height: 56px; padding: 0 18px; font: 500 26px var(--sans); text-align: center; color: var(--ink); background: var(--ground); border: 2px solid var(--ink); border-radius: 6px; }
.small { font-size: 14px; color: var(--soft); margin: 0; }
.readout { margin: 6px 0 0; color: var(--readc); font-family: var(--serif); font-size: 56px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.readout span { font-family: var(--sans); font-size: 18px; color: var(--soft); }
.readout.small-readout { font-size: 36px; }
.meter { width: min(420px, 80vw); height: 12px; border-radius: 6px; background: var(--off); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--w2); }
.recipe { width: 100%; text-align: left; border: 1.5px solid var(--line); border-radius: 10px; padding: 18px 22px; }
.recipe h3, .idea h3, .toolbox h3 { margin: 14px 0 6px; font-size: 15px; font-weight: 600; } .recipe h3:first-child { margin-top: 0; }
.recipe ol, .recipe ul { margin: 0; padding-left: 22px; line-height: 1.6; font-size: 16px; }
.code { margin: 14px 0 0; font-size: 16px; } .code strong { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1px; }
.idea { width: 100%; padding: 18px 22px; border: 1.5px solid var(--line); border-radius: 10px; text-align: center; }
.idea .say { margin: 0 auto; }
.idea > * + * { margin-top: 12px; }                    /* breathing room between the card's parts (they ran into each other) */
.idea > .knobs { margin-top: 8px; } .idea > .knobsay { margin-top: 18px; }
.idea h3 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 6px 0 8px; }
.tooltab { margin-top: 26px; background: transparent; border: 0; border-top: 1.5px solid var(--line); color: var(--soft); padding: 12px 24px 4px; cursor: pointer; font-size: 15px; }
.toolbox { width: 100%; margin-top: 26px; padding: 18px 22px; border: 1.5px solid var(--w2); border-radius: 10px; text-align: left; animation: in 250ms ease-out both; }
.toolbox h2 { margin: 0 0 4px; font-family: var(--serif); font-weight: 500; font-size: 24px; }
.fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.toolbox .small { margin: 8px 0 4px; line-height: 1.5; } .toolbox h3 { margin-top: 18px; } .toolbox .row { margin-top: 14px; }
.fx { min-height: 46px; border: 1.5px solid var(--line); background: var(--ground); color: var(--ink); border-radius: 6px; cursor: pointer; font-size: 15px; }
.fx.on { border-color: var(--btn); background: var(--btn); color: var(--btnink); } .fx:disabled { opacity: 0.35; cursor: default; }
.row.stack { flex-direction: column; align-items: stretch; max-width: 460px; margin-left: auto; margin-right: auto; }
.row.stack button { min-height: 48px; padding: 8px 18px; line-height: 1.35; }
.shelf { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.codeIn { width: min(260px, 80vw); font-size: 20px; }
button:disabled { opacity: 0.4; cursor: default; }

.pretend { width: calc(100% - 48px); max-width: 640px; margin: 0 auto 24px; padding: 14px 18px; border: 1.5px dashed var(--line); border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
.pretend[hidden] { display: none; }
.pretend p { margin: 0; font-size: 14px; color: var(--soft); }
.pretend .row { justify-content: flex-start; }
.pretend button { min-height: 40px; padding: 0 14px; border-radius: 6px; background: var(--panel); color: var(--ink); border: 1.5px solid var(--line); cursor: pointer; font-size: 15px; }
.pretend button[aria-pressed="true"] { border-color: var(--ink); }
.pknob { display: flex; flex-direction: column; gap: 6px; flex: 1 1 240px; font-size: 14px; color: var(--soft); }
.pknob input { width: 100%; accent-color: var(--ink); }

#testers { width: calc(100% - 48px); max-width: 640px; margin: 0 auto 28px; font-size: 14px; color: var(--soft); }
#testers[hidden] { display: none; }
#testers pre { white-space: pre-wrap; font-size: 12px; background: var(--panel); padding: 12px; border-radius: 8px; color: var(--ink); }
.colours { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; margin: 4px auto 22px; font-size: 13px; color: var(--soft); }
.colours button { background: transparent; border: 1px solid transparent; color: var(--soft); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 13px; min-height: 30px; }
.colours button[aria-pressed="true"] { border-color: var(--line); color: var(--ink); }
.pbar { position: relative; margin-left: auto; margin-right: auto; width: min(360px, 80vw); height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--line), var(--w2)); margin-top: 6px; }
.pbar span { position: absolute; top: -5px; width: 4px; height: 16px; margin-left: -2px; border-radius: 2px; background: var(--ink); }
.pbarlab { display: flex; justify-content: space-between; margin: 0 auto; width: min(360px, 80vw); font-size: 12px; color: var(--soft); }
.patchdg { margin: 10px auto 4px; width: min(560px, 92vw); } .patchdg.full { width: min(900px, calc(100vw - 32px)); margin-left: 0; margin-right: 0; align-self: center; }   /* wider than the column: no auto margins, so the column's centring spreads it evenly both sides (Joe, 16 Nov: it hung off to the right) */
.patchdg svg { display: block; width: 100%; height: auto; }
/* a zoomed-in diagram: hover (or tap, or Enter) to see the whole Workshop System, with a frame round the bit the step is about */
.patchdg.zoomable svg { cursor: zoom-out; border-radius: 8px; } .patchdg.zoomable.out svg { cursor: zoom-in; }
.patchdg.zoomable:focus { outline: none; } .patchdg.zoomable:focus-visible svg { outline: 2px solid var(--w2); outline-offset: 4px; }
.dframe { fill: none; stroke: var(--ink); stroke-width: 12; stroke-dasharray: 34 22; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.patchdg.out .dframe { opacity: 0.75; }
.dghint { text-align: center; font-size: 13px; color: var(--soft); margin-top: 4px; } .dghint .tap { display: none; }
@media (hover: none) { .dghint .tap { display: inline; } .dghint .hov { display: none; } }
@media (prefers-reduced-motion: reduce) { .dframe { transition: none; } }
.dpanel { color: var(--ink); opacity: 0.82; }
.dnew { stroke: #d93a40; opacity: 0.95; } .dold { stroke: #d93a40; opacity: 0.32; }   /* (Joe: a little darker, easier to see) */
.dmark { stroke: var(--w2); } .dfill { fill: var(--w2); stroke: none; }
.robotfig { display: flex; justify-content: center; align-items: flex-end; height: 240px; width: 240px; margin: 4px auto 0; border-bottom: 3px solid var(--line); }   /* the ground: under the robot, so a running lean doesn't tilt it */
.robot { width: 130px; height: auto; overflow: visible; transform-origin: 50% 98.5%; transform: scale(var(--rs, 1)); transition: transform 0.8s cubic-bezier(.3, .7, .3, 1); }
.robotfig.dim .robot { opacity: 0.45; }
.rb-box { fill: var(--panel); stroke: var(--ink); stroke-width: 5; } .rb-line { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
.rb-led { fill: var(--led, var(--w2)); } .rb-mouth { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
.rb-legL, .rb-legR, .rb-armL, .rb-armR { transform-box: view-box; }
.rb-legL { transform-origin: 84px 186px; } .rb-legR { transform-origin: 116px 186px; } .rb-armL { transform-origin: 64px 124px; } .rb-armR { transform-origin: 136px 124px; }
.robotfig.walk .rb-legL, .robotfig.walk .rb-armR { animation: rbSwing var(--stride, 1s) ease-in-out infinite; }
.robotfig.walk .rb-legR, .robotfig.walk .rb-armL { animation: rbSwing var(--stride, 1s) ease-in-out infinite reverse; }
.robotfig.walk .rb-bob { animation: rbBob calc(var(--stride, 1s) / 2) ease-in-out infinite; }
.robotfig.run .robot { --sw: 34deg; transform: rotate(8deg); } .robotfig .robot { --sw: 18deg; }
@keyframes rbSwing { 0%, 100% { transform: rotate(var(--sw)); } 50% { transform: rotate(calc(-1 * var(--sw))); } }
@keyframes rbBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@media (prefers-reduced-motion: reduce) { .robotfig.walk .rb-legL, .robotfig.walk .rb-legR, .robotfig.walk .rb-armL, .robotfig.walk .rb-armR, .robotfig.walk .rb-bob { animation: none; } .robot { transition: none; } }
.listening { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--soft); font-size: 16px; margin: 6px 0; }
.waves { display: inline-flex; align-items: center; gap: 3px; height: 18px; }
.waves i { display: block; width: 4px; height: 6px; border-radius: 2px; background: var(--w2); animation: wave 1.1s ease-in-out infinite; }
.waves i:nth-child(2) { animation-delay: 0.18s; } .waves i:nth-child(3) { animation-delay: 0.36s; }
@keyframes wave { 0%, 100% { height: 6px; } 50% { height: 18px; } }
@media (prefers-reduced-motion: reduce) { .waves i { animation: none; height: 12px; } }
.knobsay { margin: 6px auto 0; font-size: 15px; color: var(--ink); max-width: 40ch; }
.knobs { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 28px; margin: 4px 0; }
.knob { width: 128px; text-align: center; }
.knob svg { width: 80px; height: 80px; touch-action: none; cursor: grab; display: block; margin: 0 auto; }
.knob svg:focus-visible { outline: 3px solid #2f6fdb; outline-offset: 2px; border-radius: 50%; }
.kbody { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.kline { stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.knob.unset .kline { stroke: var(--soft); stroke-dasharray: 3 3; }
.ktick { fill: var(--line); cursor: pointer; } .ktick.on { fill: var(--w2); }
.kname { margin: 6px 0 0; font-size: 14px; font-weight: 600; } .kval { margin: 2px 0 0; font-size: 13px; color: var(--soft); }
.whatlink { background: none; border: 0; padding: 4px 0; color: var(--soft); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 14px; }
.whatlink:hover, .whatlink[aria-expanded="true"] { color: var(--ink); }
.explain { max-width: 46ch; margin: 0 auto; padding: 14px 18px; text-align: left; background: var(--panel); border-left: 3px solid var(--w2); border-radius: 8px; font-size: 16px; line-height: 1.55; animation: in 200ms ease-out both; }
.explain p { margin: 0; } .explain p + p { margin-top: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (prefers-reduced-motion: reduce) { .screen.in, .screen.out, .tick, .tip, .toolbox, .explain { animation: none !important; } }
@media (max-width: 560px) { header { grid-template-columns: auto 1fr; } .conn { grid-column: 1 / -1; justify-self: center; } h1 { font-size: 30px; } h1.big { font-size: 34px; } }
</style>

<script>
// =============================================================================
//  robopera_v2_protocol.js : the V2 editor's side of protocol 6.0.  Must match card/robopera_protocol.h byte for byte
//  (web2/test/xc2.js checks it against the card's own encoder and decoder).  Payloads only: the USB layer adds F0 7D ... F7.
//  AI-assisted (Claude / Anthropic).
// =============================================================================
(function (root) {
  'use strict';
  const P = {
    MAJOR: 6, MINOR: 3, PATCH: 0, ROBOT_VERSION: 1, CARD_KIND: 2,
    MSG_HELLO: 0x03, MSG_VERSION: 0x04, MSG_SET_ROBOT: 0x40, MSG_ROBOT_ACK: 0x41, MSG_STATUS: 0x43,
    ROBOT_LEN: 16, STATUS_LEN: 35,
    GATE_EFFECTS: 1, GATE_LASERS: 2, GATE_RHYTHM: 4, GATE_ALL: 7, GATE_Y_HELD: 8,
    APPLY_SEED: 1, APPLY_TEMPO_SCALE: 2,
    FL_GLIDE: 1, FL_OCTAVE: 2, FL_TRILLS: 4,
    FX: { ECHO: 1, REVERB: 2, CHORUS: 3, CRUSH: 9, FLANGER: 11, FOLD: 13 },
    ACK: { OK: 0, BAD_VERSION: 1, BAD_LENGTH: 2, BAD_CHECKSUM: 3 },
  };
  // the effects offered, and pairs too heavy for the card (measured 22 Oct): the same rules as robopera_protocol.h
  const allowed = new Set([P.FX.REVERB, P.FX.CRUSH, P.FX.ECHO, P.FX.CHORUS, P.FX.FLANGER, P.FX.FOLD]);   // the wavefolder back (1 point per sample, 23 Oct)
  P.fxAllowed = (t) => allowed.has(t);
  P.fxTooHeavy = () => false;   // (27 Oct: no pair is too heavy any more - the card runs echo before reverb, +2%)
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v | 0));
  // the same rules as the card's SanitiseRobot
  P.sanitise = function (r) {
    const o = Object.assign({ seed: 1, tempoK: 2048, scaleIdx: 1, flourishes: 0, fxX: P.FX.REVERB, fxY: P.FX.CRUSH, gate: P.GATE_ALL, apply: 0, stereo: false, sync: 0 }, r);
    o.stereo = !!o.stereo; o.sync = o.sync >= 0 && o.sync <= 3 ? o.sync | 0 : 0;
    o.seed = o.seed >>> 0; o.tempoK = clamp(o.tempoK, 0, 4095); o.scaleIdx = Math.min(o.scaleIdx & 127, 7);
    o.flourishes &= 7; o.gate &= 15; o.apply &= 3;
    if (!allowed.has(o.fxX)) o.fxX = P.FX.REVERB;
    if (!allowed.has(o.fxY)) o.fxY = P.FX.CRUSH;
    if (o.fxX === o.fxY) o.fxY = o.fxX === P.FX.CRUSH ? P.FX.REVERB : P.FX.CRUSH;
    return o;
  };
  const put14 = (m, i, v) => { v = clamp(v, 0, 16383); m[i] = (v >> 7) & 127; m[i + 1] = v & 127; };
  const get14 = (m, i) => ((m[i] & 127) << 7) | (m[i + 1] & 127);
  P.checksum = (m) => { let c = 0; for (let i = 1; i < P.ROBOT_LEN - 1; ++i) c ^= m[i]; return c & 127; };
  P.hello = () => [P.MSG_HELLO, P.MAJOR, P.MINOR, P.PATCH];
  // SET_ROBOT payload (16 bytes)
  P.encodeRobot = function (robot) {
    const r = P.sanitise(robot), m = new Array(P.ROBOT_LEN).fill(0), s = r.seed >>> 0;
    m[0] = P.MSG_SET_ROBOT; m[1] = P.ROBOT_VERSION;
    m[2] = (s >>> 28) & 15; m[3] = (s >>> 21) & 127; m[4] = (s >>> 14) & 127; m[5] = (s >>> 7) & 127; m[6] = s & 127;
    put14(m, 7, r.tempoK); m[9] = r.scaleIdx & 127; m[10] = (r.flourishes & 7) | (r.stereo ? 8 : 0); m[11] = r.fxX & 127; m[12] = r.fxY & 127;
    m[13] = (r.gate & 3) | ((r.sync & 3) << 2) | ((r.gate & 12) << 2);   // gate bits 0-1, sync 2-3, rhythm 4, Y held 5 (6.3)
    m[14] = r.apply & 127; m[15] = P.checksum(m);   // (once lost inside the comment above)
    return m;
  };
  // VERSION: [0x04, major, minor, patch, robotVersion, cardKind] -> null if it isn't a V2 card
  P.decodeVersion = function (m) {
    if (!m || m[0] !== P.MSG_VERSION || m.length < 4) return null;
    const v = { major: m[1], minor: m[2], patch: m[3], robotVersion: m[4], cardKind: m[5] };
    v.isV2 = v.major === P.MAJOR && v.cardKind === P.CARD_KIND;
    return v;
  };
  P.decodeAck = (m) => (m && m[0] === P.MSG_ROBOT_ACK && m.length >= 2) ? m[1] : null;
  // STATUS payload (26 bytes) -> an object (null if not a status)
  P.decodeStatus = function (m) {
    if (!m || m.length !== P.STATUS_LEN || m[0] !== P.MSG_STATUS) return null;
    const j = m[10] & 63;
    return {
      awake: m[1] !== 0, waking: m[2] !== 0, z: m[3], mainK: m[4] << 5, xK: m[5] << 5, yK: m[6] << 5,
      bpm: get14(m, 7) / 2, bpmX2: get14(m, 7), scaleIdx: m[9], jacks: j,
      plugged: { audio1: !!(j & 1), audio2: !!(j & 2), cv1: !!(j & 4), cv2: !!(j & 8), pulse1: !!(j & 16), pulse2: !!(j & 32) },
      voice: m[11], face: m.slice(12, 18).map((v) => v & 127),
      cpuAvg: m[18], cpuPeak: m[19], robotPrint: ((m[20] & 127) << 7) | (m[21] & 127), received: m[22],
      flourishes: m[23], fxX: m[24], fxY: m[25],
      // 6.1: listening
      hz: get14(m, 26) / 4, noteMv: get14(m, 28) - 8192, conf: m[30], seq: m[31], rhythm: m[32], lengths: m[33],
      sync: m[34],   // 6.2: the sync setting the card has (0 = 2 pulses per beat, 1 = 4, 2 = 1, 3 = 24)
    };
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = P; else root.RoboperaV2Protocol = P;
})(this);

</script>
<script>
const EXPLAIN = {"connect": ["The USB cable lets this web page and the Computer module talk to each other. They use MIDI, the same language keyboards and drum machines use, sending short messages back and forth many times a second. The page sends the robot’s settings; the Computer sends back what it is doing: which knobs have moved, which sockets have cables in, and the brightness of its six lights. That is how the face on this screen copies the real one."], "wake": ["The Computer runs the Robopera program, stored on the little program card. The program checks the Z switch thousands of times a second. When you flick it down, it starts the robot: it plays a short wake-up sequence on the six lights, then begins making the song. The lights are switched on and off by the program, very fast, which is how they can glow, breathe and blink."], "name": ["When you name your robot, this page also picks a random number, called a seed, and sends it to the Computer. The seed decides your robot’s song: its little musical ideas (motifs), its rhythms and its melodies. The same seed always makes the same song, so your robot always sounds like themselves. A different seed makes a different robot."], "voice": ["The top oscillator makes a square wave: a voltage that snaps between high and low hundreds of times a second. That sharp shape makes a bright, buzzy sound. The Computer’s first CV/Audio input measures that voltage 48,000 times a second, turning the sound into numbers the Computer can work with. The program follows how big the swings are (how loud the sound is) and lights the robot’s mouth to match."], "hear": ["The Computer turns its numbers back into a voltage at its first CV/Audio output, 48,000 times a second. For now it passes the voice straight through; later it will add effects. Mix 1 sets how loud that voltage is, and sends it to your headphones or speaker. Mix 1 also has a pan knob, which moves the sound between left and right."], "filter": ["The Humpback Filter shapes a sound by letting some frequencies through and holding others back. Its low-pass output lets the low ones pass and turns down the high ones. The cut-off is the point where it starts turning things down: high, and everything gets through; low, and less does. A square wave is full of harmonics, so here the filter changes the voice’s brightness as well as its loudness: low, and it’s dull and quiet; high, and it’s bright and buzzy."], "mouthhand": ["Turning the cut-off knob moves the point where the filter starts turning the sound down. Turn it low, and less of the voice gets through, like a mouth closing; turn it up, and the mouth opens. The Computer is still listening on its first CV/Audio input, so the robot’s lights follow the loudness as you turn."], "slope": ["A Slope makes a voltage that moves smoothly up and down. In Loop mode it does this again and again, like a slow wave you can’t hear but can use to move something. The filter’s FM input lets a voltage move the cut-off; its FM knob sets how much. With the cut-off fully down, the mouth is closed until the Slope opens it, then lets it close again. The Slope’s knob sets how fast."], "falling": ["The Falling shape jumps up quickly, then falls back slowly. A shape like this, which starts a sound and then lets it fade, is called an envelope. It’s how a sung word or a plucked string behaves: a strong start, then a fade. The bottom Slope falls quickly at first and then more gently (it’s exponential), which sounds natural."], "rhythm": ["the Computer’s first Pulses output sends short on-and-off pulses of about 5 volts. In Pulse In mode, the Slope waits for a pulse, and each pulse starts its falling shape again: each pulse becomes a note. The Computer decides when to send each pulse, from your robot’s motifs, so the rhythm is your robot’s own. (Short pulses really only start a Slope properly in the Falling shape, which is why we chose it.)"], "size": ["The big knob sets how fast the oscillator vibrates: its frequency, measured in vibrations per second (hertz). Faster sounds higher. Big things, like a cello or a big bell, vibrate slowly; small things, like a whistle or a tiny bell, vibrate fast. That’s why a high voice sounds small and a low one sounds large."], "tempo": ["The Computer reads the Main knob and decides how quickly the beats come: 20 to 240 beats per minute. At 120 BPM there’s a beat every half a second, and the song moves in quarters of a beat (sixteenth notes), one every eighth of a second. Turn Main, and every pulse the Computer sends comes sooner or later."], "tune": ["The oscillator’s Pitch input listens to a voltage: every extra volt makes the frequency twice as high, which is exactly one octave up. This is called volt per octave. One twelfth of a volt (about 83 thousandths) is one semitone, the smallest step on a piano. For each note of the melody, the Computer works out the voltage and sends it from its first CV output, using measurements stored on the Computer so the notes are in tune. The big knob still sets where the tune starts, which is why size still works."], "scale": ["An octave has twelve semitones. A scale picks some of them, usually five or seven. Your robot’s melody is written in scale steps (“up two steps, down one”), so the Computer can fit the same tune into any scale you choose. Different scales feel different because of the gaps between their notes: in a major scale, the third note is four semitones above home, which sounds bright; in a minor scale it is three, which sounds darker."], "lengths": ["The Slope’s CV input changes how fast it falls: a higher voltage makes the fall slower, so the note lasts longer. For every note, the Computer sends a slightly different voltage from its second CV output, so some notes are short and some are long, and the pattern of lengths belongs to your robot. The Slope’s knob sets the middle length that the Computer works around."], "voicetype": ["A square wave snaps between high and low, and that sharp shape contains many extra, quieter frequencies above the main one: three times it, five times it, and so on. These are called harmonics, and they make the sound brighter and buzzier. A sine wave contains just one frequency: a smooth, pure tone, the simplest sound there is. A low-pass filter turns harmonics down, so with a square wave, moving the cut-off changes the brightness as well as the loudness; with a sine wave, it mostly changes the loudness."], "fm": ["FM means frequency modulation: one oscillator moving another’s pitch. Each oscillator’s FM input is internally patched to the other oscillator’s sine wave, so turning up the top oscillator’s FM lets the bottom oscillator push its pitch up and down. If the bottom one is slow, you hear a wobble. If it’s fast (a note in its own right), the wobbles are too quick to hear as wobbles, and new tones appear instead: growls, buzzes and metallic sounds."], "resonance": ["Resonance makes the filter boost the frequencies right at the cut-off, a narrow peak just before everything is turned down. A little sounds nasal; more sounds sharper. When the Slope moves the cut-off, the peak moves too, sweeping through the voice: that’s the wet, squelchy sound. A square wave has more harmonics for the peak to catch, so the effect is stronger on a buzzy robot."], "bright": ["The filter’s FM knob sets how far the Slope opens the mouth on each note. Turn it down, and the mouth only opens a little: quieter, and duller with a buzzy voice, as if they were further away. The cut-off sets where the mouth starts from. Between them, they set how bright and how loud each note can be."], "home": ["From here, the Computer changes the sound itself. Inside, the voice is a stream of numbers, 48,000 a second, so the program can do arithmetic on it before sending it back out. Reverb copies the sound into many short delays that feed into each other, imitating sound bouncing off walls. Turning up X adds more of this, and makes it ring for longer, like a bigger space."], "age": ["A bitcrusher makes digital sound rougher on purpose. It keeps fewer of the 48,000 numbers each second, holding each one for longer, and rounds them to fewer possible levels. The result is the crunchy, grainy sound of early computers and game consoles. The Computer crushes the voice first and adds the reverb after, as a studio would, so an old robot can still live in a smooth-sounding space."], "touch": ["The flourishes are decisions the Computer makes as it builds each phrase, note by note. It uses its own random numbers, which also come from your robot’s seed, so each robot uses its flourishes in its own way. Turning a flourish on or off sends a short message to the Computer, which uses it from the next phrase. The rest of the song stays exactly the same."], "glides": ["Normally the pitch voltage jumps straight to each new note. With glides, the Computer slides the voltage there smoothly instead, over about a tenth of a second (never more than half the note), so the voice swoops between notes. This is also called portamento."], "octaves": ["The Computer briefly adds exactly one volt to the pitch voltage, or takes one away, for about six hundredths of a second. Because the oscillator works in volts per octave, one volt is exactly one octave: the voice flips up or down an octave, then straight back."], "trills": ["A trill swaps quickly between a note and the next note up the scale, in quarter-beats, before settling. A flurry replaces the last beat of a phrase with a quick run of four notes climbing to its final note. Both stay in time with the beat, and in the robot’s scale."], "lasers": ["Behind the panel is a piezo contact microphone, which turns tiny vibrations of the panel into a small voltage. The Amplifier makes it bigger. A tap makes a sharp spike, and the Computer’s second Pulses input turns any voltage over a set level into a pulse. The Computer then makes the laser itself: a buzzy tone that starts high and swoops down, mixed in with the voice. It ignores pulses just after its own notes, in case the robot’s sound reaches the microphone."], "recipe": ["A patch is a set of cables and settings. The word comes from early synthesisers and telephone exchanges, where cables were “patched” between sockets. The Computer also remembers your robot (their seed, tempo, scale, flourishes and effects) in its flash memory, the kind of memory that keeps things when the power is off. It saves when your robot falls asleep, because writing to flash briefly pauses the sound."], "fx1": ["The Computer keeps the last moments of the voice in its memory and plays them back about a third of a second later. Some of each repeat is fed back in, so the echoes repeat again, each a little quieter, like a voice calling across a valley."], "fx3": ["The Computer mixes the voice with a copy delayed by a tiny amount, a few thousandths of a second, and keeps that delay gently changing. A changing delay makes the copy’s pitch drift very slightly, so the two sound like several voices singing together."], "fx11": ["Like a chorus, but with an even shorter delay, and some of the copy fed back in. Mixing a sound with a very slightly delayed copy cancels some frequencies and boosts others in a regular pattern. As the delay slowly sweeps, that pattern sweeps through the voice: the whoosh of a jet passing overhead."], "fx13": ["The Computer turns the voice up, a lot. When the wave would go past a limit, instead of being cut off it folds back on itself, like a sheet of paper folded over, then folds again. Every fold adds new harmonics, so the voice gets brighter and more metallic the further you turn the knob."], "idea_ringmod": ["The Ring Mod multiplies two sounds together. The two sine waves are internally patched to its inputs. Multiplying two notes creates two new ones: their frequencies added together, and one taken from the other. A note vibrating 400 times a second and one at 100 give 500 and 300. Those new notes usually aren’t in a musical relationship to the originals, which is why it sounds harsh, or like a bell."], "idea_amp": ["The Amplifier is built to boost a microphone’s tiny voltage. The synth’s voice is far bigger than that, so the Amplifier runs out of room: the tops and bottoms of the wave get squashed flat. Squashing a wave adds new, harsher harmonics, which is what distortion is."], "idea_stomp": ["The Stompbox lets a guitar pedal join the synth. It sends the voice out to the pedal in a form pedals are happy with, then brings the pedal’s sound back in: a pair called a send and return. The blend knob mixes the untouched voice with the pedal’s sound. The feedback knob sends some of the pedal’s sound back into it again: off at 12 o’clock, and wilder the further you turn it either way. Underneath the panel, a 9-volt socket can power the pedal."], "idea_cv1": ["4 Voltages makes its voltages from a network of resistors set by the buttons and the knob. They aren’t random, but they’re hard to predict. The Computer remembers the voltage when the cable goes in as “home”. Every 0.4 volts or so away from home moves the tune one step up or down the scale, so it always stays in key."], "idea_cv2": ["Your robot’s song grows from its seed: the random number picked when you named them. The Computer’s second CV input works like the first: the voltage when the cable goes in is “home”. Every 0.4 volts or so away from home, the Computer gives the song a different seed, so your robot sings new motifs: new little musical ideas for their phrases. The change waits for the end of the phrase, so your robot never stops mid-sentence. Back at home, or unplugged, their own seed and their own song return."], "idea_stereo": ["Your two ears hear slightly different sounds, and your brain uses the differences to place sounds around you. The Computer’s second CV/Audio output sends the same robot as its first CV/Audio output, but with the other side of the effects: the reverb’s reflections mixed in a different pattern, the echoes arriving half an echo later, the chorus and flanger wobbling out of step. The voice itself is the same on both, so it stays in the middle, while the space around it spreads out. Panning Mix 1 left and Mix 2 right sends one side to each ear."], "idea_sync": ["A clock is a stream of short pulses that tells another machine when each step happens. Machines count them differently: Volcas and Pocket Operators send 2 pulses for every beat, some Eurorack sequencers send 4, some just 1, and DIN sync clocks 24. If the robot expected 4 and was sent 2, it would play at half speed, so the sync setting tells it how to count. With a clock in the Computer’s first Pulses input, it turns each pulse into steps of the robot’s song, spaced evenly in between, and starts each phrase on the beat. The Computer’s second Pulses output sends pulses at the same rate, so the robot can lead instead."], "fx2": ["From here, the Computer changes the sound itself. Inside, the voice is a stream of numbers, 48,000 a second, so the program can do arithmetic on it before sending it back out. Reverb copies the sound into many short delays that feed into each other, imitating sound bouncing off walls. Turning up X adds more of this, and makes it ring for longer, like a bigger space."], "fx9": ["A bitcrusher makes digital sound rougher on purpose. It keeps fewer of the 48,000 numbers each second, holding each one for longer, and rounds them to fewer possible levels. The result is the crunchy, grainy sound of early computers and game consoles. The Computer crushes the voice first and adds the reverb after, as a studio would, so an old robot can still live in a smooth-sounding space."]};
</script>
<script>
	  var midiOutput = null, midiInput = null;
	  var midiActive = false;
	  
      // WebMIDI Setup
      // Establishes WebMIDI and sets up calls to BindDevices
	  async function MIDISetup(interfaceName, onConnect = () => {}, onDisconnect = () => {})
	  {
		  try
		  {
			  const midi = await navigator.requestMIDIAccess({ sysex: true });
			  
			  // run once at startup
			  BindDevices(midi, interfaceName, onConnect, onDisconnect);
			  
			  // run whenever devices change
			  midi.addEventListener('statechange', (e) => {
				  BindDevices(midi, interfaceName, onConnect, onDisconnect);
			  });			  
		  }
		  catch (error)
		  {
			  document.getElementById('connectedStatus').innerHTML = 'WebMIDI error ('+error+')';
          }

	  }

	  // Called on WebMIDI initialisation, and whenever a device is connected or disconnected
	  // Ignores non-WS MIDI devices, but does not handle multiple Workshop Systems.
	  function BindDevices(midi, interfaceName, onConnect, onDisconnect)
	  {
		  // If we already have a MIDI connection, check if it has been disconnected
		  if (midiActive)
		  {
			  const foundInput = [...midi.inputs.values()].some(input =>
				  input.name.includes(interfaceName) &&
					  input.state === "connected"
			  );

			  const foundOutput = [...midi.outputs.values()].some(output =>
				  output.name.includes(interfaceName) &&
					  output.state === "connected"
			  );

			  if (!foundInput || !foundOutput)
			  {
				  midiActive = false;
				  midiOutput = undefined;
				  midiInput = undefined;
				  onDisconnect();
			  }
		  }
		  else // if we don't have a MIDI connection to the WS, see if we can now create one.
		  {
			  midiInput = [...midi.inputs.values()].find(input =>
				  input.name.includes(interfaceName) &&
					  input.state === "connected");
			  
			  midiOutput = [...midi.outputs.values()].find(output =>
				  output.name.includes(interfaceName) &&
					  output.state === "connected");
			  
			  if (midiInput && midiOutput)
			  {
				  midiInput.onmidimessage = HandleMIDI;
				  midiActive = true;
				  onConnect();
			  }
			  else
			  {
				  // Clear both inputs/outputs, in the event that we only found interface for one of them
				  midiOutput = undefined;
				  midiInput = undefined;
			  }
		  }		  
	  }


	  // Called when MIDI received from Workshop system
	  function HandleMIDI(event)
	  {
		  // Send SysEx data on to ProcessIncomingSysEx. Ignore other MIDI messages.
		  const data = Array.from(event.data);
		  if (data.length>3
			  && data[0] === 0xF0
			  && data[1] === 0x7D
			  && data[data.length - 1] === 0xF7)
		  {
			  ProcessIncomingSysEx(data.slice(2, data.length-1));
		  }
	  }
	  

	  // Used to check that we're not sending data outside of permitted 0x00-0x7F range in sysex
	  function Assert7BitArray(arr, name)
	  {
		  if (!Array.isArray(arr))
		  {
			  throw new Error(`${name} must be an array`);
		  }

		  arr.forEach((v, i) =>
			  {
				  if ( v < 0 || v > 0x7F)
				  {
				  throw new Error(`${name}[${i}] is invalid (${v}). Must be integer 0–127.`);
				  }
			  });
	  }

	  // Wrap provided data in SysEx header/footer, and send over USB
      function SendSysEx(dataBytes)
	  {
		  if (midiActive)
		  {
			  Assert7BitArray(dataBytes, 'dataBytes');
			  midiOutput.send([0xF0,
							   0x7D,
							   ...dataBytes,
							   0xF7]);
		  }
      }

  1: ['Echo', 'Repeats, like a voice calling across a valley. Is your robot far away?'], 3: ['Chorus', 'A shimmering, doubled voice. Is your robot singing with friends?'],

// ---------------- the card (real, through WebMIDI) ----------------
function ProcessIncomingSysEx(d) {      // called by midi_generic.js
  if (d[0] === P.MSG_VERSION) { S.version = P.decodeVersion(d); S.v1Card = !!S.version && !S.version.isV2; draw(); return; }
  if (d[0] === P.MSG_STATUS) { const st = P.decodeStatus(d); if (st && !S.pretend) setStatus(st); return; }
  if (d[0] === P.MSG_ROBOT_ACK) { const a = P.decodeAck(d); if (a !== P.ACK.OK) console.warn('robot refused', a); }
}
function OnConnect() { S.real = true; setConn(true, 'Connected'); SendSysEx(P.hello()); }
function OnDisconnect() { S.real = false; S.status = null; S.version = null; setConn(false, 'Not connected'); draw(); }
function setConn(on, text) { document.getElementById('conn').classList.toggle('on', on); document.getElementById('connectedStatus').textContent = text; }
function setStatus(st) {
  if (S.version && !S.version.isV2) return;
  S.status = st; track(st); drawFace(st.face); testers(st); draw();
}
// the sync setting: what the user chose here, otherwise what the card says it remembers (0 = 2 pulses per beat, 1 = 4, 2 = 1)
const SYNC_NAMES = ['2 pulses per beat', '4 pulses per beat', '1 pulse per beat', '24 pulses per beat'];
function syncNow() { return S.sync !== undefined ? S.sync : (S.status && S.status.sync >= 0 && S.status.sync <= 3 ? S.status.sync : 0); }
function sendRobot(apply, ts) {   // ts: tempo and scale to set (with APPLY_TEMPO_SCALE)
  const msg = P.encodeRobot({ seed: S.robot.seed, tempoK: ts ? ts.tempoK : 2048, scaleIdx: ts ? ts.scaleIdx : 1, flourishes: S.robot.flourishes,
    fxX: S.robot.fxX, fxY: S.robot.fxY, gate: S.gate /* effects and lasers are unlocked at their screens (D4) */, apply, stereo: !!S.robot.stereo, sync: syncNow() });
  if (S.pretend) Pretend.robot(msg); else if (S.real) SendSysEx(msg);
}
function testers(st) {
  if (document.getElementById('testers').hidden) return;
  document.getElementById('cpu').textContent = `Card's CPU load (average / busiest moment): ${st.cpuAvg}% / ${st.cpuPeak}%`;
  document.getElementById('raw').textContent = JSON.stringify(Object.assign({ version: S.version }, st), null, 1);
}

// ---------------- the pretend card ----------------
const Pretend = (() => {
  // a pretend Workshop System: just enough to click through the screens.  Its face is a sketch; the real editor shows the card's own LEDs.
  const BPM = [20, 25, 31, 39, 49, 61, 77, 96, 120, 131, 143, 156, 170, 185, 202, 220, 240];   // the card's tempo knob (kV2Bpm)
  let t0 = performance.now(), awake = false, wakeAt = -1e9, audio1 = false, cutoff = 0.7, loop = false, main = 2048, z = 1, tempoK = 2048, scaleIdx = 1, timer = null, unplugUntil = 0, xk = 0, yk = 0, pulse2 = false;
  let baseHz = 130.81, tuneP = false, pulseP = false, lenP = false, seq = 0, lastNote = 0, noteMv = 0, plugged = false;   // stage 5: what the card would hear
  const bpmOf = (k) => { const i = Math.min(15, k >> 8), f = (k & 255) / 256; return BPM[i] + (BPM[i + 1] - BPM[i]) * f; };
  function voice() {
    if (!audio1 || performance.now() < unplugUntil) return 0;
    const t = (performance.now() - t0) / 1000;
    return Math.round(90 * cutoff * (loop ? 0.5 + 0.5 * Math.sin(2 * Math.PI * 1.5 * t) : 1));
  }
  const st = () => { plugged = audio1 && performance.now() >= unplugUntil; const v = voice();
    return { awake: awake && performance.now() - wakeAt > 3000, waking: awake && performance.now() - wakeAt <= 3000, z, mainK: main, xK: xk, yK: yk,
      bpm: bpmOf(tempoK), bpmX2: Math.round(bpmOf(tempoK) * 2), scaleIdx, jacks: plugged ? 1 : 0,
      plugged: { audio1: plugged, audio2: false, cv1: false, cv2: false, pulse1: false, pulse2 },
      voice: v, face: face(v), cpuAvg: 0, cpuPeak: 0, robotPrint: 0, received: 0, flourishes: 0, fxX: 2, fxY: 9, ...heard() }; };
  function heard() {   // a new 'measured note' every 0.4 s while singing
    if (awake && plugged && performance.now() - lastNote > 400) { lastNote = performance.now(); seq = (seq + 1) & 127; noteMv = [0, 167, 333, 500, 583, 750, 917, 1000][(Math.random() * 8) | 0]; }
    return { hz: plugged && awake ? baseHz * (tuneP ? Math.pow(2, noteMv / 1000) : 1) : 0, noteMv, conf: 120, seq, rhythm: pulseP ? 127 : 20, lengths: lenP ? 120 : 55, sync: S.sync || 0 };
  }
  function face(v) {
    const t = (performance.now() - t0) / 1000, f = [0, 0, 0, 0, 0, 0];
    if (!awake) { f[2] = Math.round(5 + 45 * (0.5 - 0.5 * Math.cos(2 * Math.PI * t / 4))); return f; }
    const w = (performance.now() - wakeAt) / 1000;
    const eye = w < 1.1 ? ((w * 8) % 1 < 0.2 ? 2 : 93) : (t % 4.6 > 4.45 ? 2 : 93);
    f[1] = eye; f[5] = eye;
    const mouth = w < 1.1 ? 0 : w < 3 ? Math.round(80 * Math.sin(Math.PI * (w - 1.1) / 1.9)) : Math.max(22, Math.min(127, Math.round(v * 1.4)));
    f[0] = f[2] = f[4] = mouth; return f;
  }
  function tick() { if (S.pretend) setStatus(st()); }
  return {
    start() { S.pretend = true; t0 = performance.now(); document.getElementById('pretend').hidden = false; setConn(true, 'Pretend'); if (!timer) timer = setInterval(tick, 50); buttons(); tick(); },
    robot(msg) { /* the pretend card accepts any robot */ },
    act(a) {
      if (a === 'z') { awake = !awake; if (awake) wakeAt = performance.now(); }
      if (a === 'sine') audio1 = !audio1;
      if (a === 'filter') { audio1 = true; unplugUntil = performance.now() + 600; }     // moving cables: the Computer’s first CV/Audio input empty for a moment
      if (a === 'loop') loop = !loop;
      if (a === 'zup') { z = 2; } if (a === 'zmid') { z = 1; }
      if (a === 'pulse2') pulse2 = !pulse2;
      if (a === 'pulseP') pulseP = !pulseP; if (a === 'tuneP') tuneP = !tuneP; if (a === 'lenP') lenP = !lenP;
      buttons(); tick();
    },
    knob(which, v) { if (which === 'pitch') baseHz = 32.7 * Math.pow(2, v / 100); if (which === 'x') xk = v; if (which === 'y') yk = v; if (which === 'cutoff') cutoff = v / 100; if (which === 'main') { main = v; if (z === 2) scaleIdx = Math.min(7, v >> 9); else tempoK = v; } tick(); },
    state: () => ({ awake, audio1, loop, z, main, cutoff, xk, yk, pulse2, baseHz, tuneP, pulseP, lenP }),
  };
})();
function buttons() {   // only the pretend controls this screen needs
  const s = Pretend.state(), id = SCREENS[S.step].id, b = [];
  const btn = (act, label, pressed) => `<button data-act="p${act}"${pressed === undefined ? '' : ` aria-pressed="${pressed}"`}>${label}</button>`;
  const knob = (which, label, min, max, val) => `<label class="pknob">${label}<input type="range" data-knob="${which}" min="${min}" max="${max}" value="${val}"></label>`;
  if (['connect', 'wake'].includes(id) || !s.awake) b.push(btn('z', s.awake ? 'Flick Z down (sleep)' : 'Flick Z down'));
  if (id === 'voice') b.push(btn('sine', (s.audio1 ? 'Unplug' : 'Plug') + ' the square into the Computer’s first CV/Audio input', s.audio1));
  if (id === 'filter') b.push(btn('filter', 'Move the cables through the filter'));
  if (['mouthhand', 'slope'].includes(id)) b.push(knob('cutoff', 'The filter’s cut-off', 0, 100, Math.round(s.cutoff * 100)));
  if (id === 'slope') b.push(btn('loop', 'Slope looping into the filter’s FM', s.loop));
  if (id === 'tempo' || id === 'scale') b.push(knob('main', 'The Main knob', 0, 4095, s.main));
  if (id === 'rhythm') b.push(btn('pulseP', 'Patch the Computer’s first Pulses output into the Slope', s.pulseP));
  if (id === 'size') b.push(knob('pitch', 'The top oscillator’s pitch', 0, 500, Math.round(100 * Math.log2(s.baseHz / 32.7))));
  if (id === 'tune') b.push(btn('tuneP', 'Patch the Computer’s first CV output into the oscillator’s Pitch', s.tuneP));
  if (id === 'lengths') b.push(btn('lenP', 'Patch the Computer’s second CV output into the Slope’s CV', s.lenP));
  if (id === 'scale') { b.push(btn('zup', 'Flip Z up', s.z === 2)); b.push(btn('zmid', 'Z back to the middle', s.z === 1)); }
  if (id === 'home') b.push(knob('x', 'The X knob', 0, 4095, s.xk));
  if (id === 'age') b.push(knob('y', 'The Y knob', 0, 4095, s.yk));
  if (id === 'lasers') b.push(btn('pulse2', (s.pulse2 ? 'Unplug' : 'Plug') + ' the Amplifier into the Computer’s second Pulses input', s.pulse2));
  if (!b.length) b.push('<p>Nothing to do on the pretend panel here: just listen, in your imagination.</p>');
  document.getElementById('pretendRow').innerHTML = b.join('');
}
document.addEventListener('input', (e) => { const k = e.target.dataset && e.target.dataset.knob; if (k) Pretend.knob(k, +e.target.value); });

// ---------------- actions ----------------
const NAMES = ['Bop', 'Pip', 'Ziggy', 'Tinker', 'Volta', 'Nimbus', 'Gizmo', 'Echo', 'Sprocket', 'Widget', 'Lumen', 'Fizz'];
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act; e.preventDefault();
  if (act === 'next') go(S.step + 1);
  if (act === 'pretend') Pretend.start();
  if (act === 'dice') { S.name = NAMES[Math.floor(Math.random() * NAMES.length)]; const i = document.getElementById('nameIn'); if (i) i.value = S.name; draw(); }
  if (act === 'yes') { S.heard = true; S.tip = false; go(S.step + 1); }
  if (act === 'notyet') { S.tip = true; draw(); }
  if (act === 'restart') { S.name = ''; S.heard = false; S.tip = false; S.gate = 0; S.robot.flourishes = 0; S.robot.fxX = P.FX.REVERB; S.robot.fxY = P.FX.CRUSH; S.robot.wave = ''; S.robot.lasers = false; S.robot.amp = false; S.robot.pedal = false; S.robot.loop = false; S.robot.pedalName = ''; S.robot.knobs = {}; S.robot.homeNote = undefined; S.robot.stereo = false; S.robot.shape = 'falling'; S.saved = false; go(0); }
  if (act === 'toload') go(idx('load'));
  if (act === 'topatch') go(idx('recipe'));
  if (act === 'skipflo') go(idx('lasers'));
  if (act === 'wave') { S.robot.wave = a.dataset.wave; go(S.step + 1); }
  if (act === 'ideachoice') {    // free play: the patch changed - keep it right (and let it go back on the shelf)
    const [k, v] = a.dataset.v.split(':'), cur = S.robot.wave || 'square';
    if (k === 'wave') { if (v === 'back') S.robot.wave = S.robot.waveBefore || 'square'; else { if (v === 'ringmod' && cur !== 'ringmod') S.robot.waveBefore = cur; S.robot.wave = v; } }
    if (k === 'amp') S.robot.amp = v === 'on';
    if (k === 'pedal') S.robot.pedal = v === 'on';
    if (k === 'loop') S.robot.loop = v === 'on';
    if (k === 'stereo') { S.robot.stereo = v === 'on'; sendRobot(0); }
    if (k === 'sync') { S.sync = +v; sendRobot(0); }
    if (k === 'shape') S.robot.shape = v;   // the card remembers it (the status reports it back)   // the card works out the Computer’s second CV/Audio output only for a stereo robot
    S.patchNote = true; S.saved = false; draw(); }
  if (act === 'flo') { S.robot.flourishes ^= FLO[a.dataset.flo][0]; sendRobot(0); draw(); }
  if (act === 'shelf') { putOnShelf(); draw(); }
  if (act === 'copycode') { try { navigator.clipboard.writeText(roboCode(robotNow())); a.textContent = '✓ Copied'; } catch (err) {} }
  if (act === 'ideanext') { S.knobNote = null; S.explain = null; S.patchNote = false; S.idea = (S.idea || 0) + 1; const n = (S.prompts || []).length + ideas().length; if (S.idea >= n) S.idea = 0; draw(); }
  if (act === 'ideaprev') { S.knobNote = null; S.explain = null; S.patchNote = false; S.idea = Math.max(0, (S.idea || 0) - 1); draw(); }
  if (act === 'toolopen') { S.toolOpen = true; S.fxBefore = [S.robot.fxX, S.robot.fxY]; draw(); }
  if (act === 'fx') { const f = +a.dataset.fx; if (a.dataset.knob === 'X') S.robot.fxX = f; else S.robot.fxY = f; sendRobot(0); draw(); }
  if (act === 'fxreset') { S.robot.fxX = P.FX.REVERB; S.robot.fxY = P.FX.CRUSH; sendRobot(0); draw(); }
  if (act === 'toolclose') {     // the next ideas are about the newly chosen effects
    S.toolOpen = false; S.prompts = [];
    [['X', S.robot.fxX, S.fxBefore[0]], ['Y', S.robot.fxY, S.fxBefore[1]]].forEach(([k, f, was]) => { if (f !== was) S.prompts.push([`Turn ${k} up: that’s the ${FXN[f][0].toLowerCase()} now`, FXN[f][1]]); });
    S.idea = 0; draw(); }
  if (act === 'loadshelf') { const x = shelf()[+a.dataset.i]; if (x) bringRobot(x.name, x.robot); }
  if (act === 'loadcode') { const r = readCode(document.getElementById('codeIn').value); S.codeBad = !r;
    if (r) bringRobot(document.getElementById('codeName').value.trim() || 'Robot', r); else draw(); }
  if (act === 'explain') { S.explain = S.explain === a.dataset.key ? null : a.dataset.key; draw(); }
  if (act === 'nolasers') { S.robot.lasers = false; go(S.step + 1); }
  if (act === 'askyes') { if (SCREENS[S.step].id === 'lasers') S.robot.lasers = true; S.tr.asked = true; S.tr.tip = false; go(S.step + 1); }   // (owner: Yes goes straight on - no second button)
  if (act === 'asknot') { S.tr.tip = true; draw(); }
  if (act && act.startsWith('p') && act !== 'pretend') Pretend.act(act.slice(1));
});
document.addEventListener('input', (e) => { if (e.target.id === 'nameIn') { S.name = e.target.value; draw(); } if (e.target.id === 'pedalName') { S.robot.pedalName = e.target.value; const n = e.target.value.trim(); const b = document.querySelector('[data-v="pedal:on"]'); if (b) b.textContent = `Keep my ${n ? n + ' ' : ''}pedal in the patch`; } });   // (the screen isn't redrawn while typing: just the button follows)
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'nameIn' && ready('name')) go(S.step + 1); });
document.getElementById('back').addEventListener('click', () => go(S.step - 1));
function go(n) {
  n = Math.max(0, Math.min(SCREENS.length - 1, n));
  const from = SCREENS[S.step].id;
  if (from === 'name' && n > S.step) {   // the robot is born: a new seed, a new song (sent to the card)
    const a = new Uint32Array(1); crypto.getRandomValues(a); S.robot.seed = a[0] >>> 0; sendRobot(P.APPLY_SEED);
  }
  // D4: X unlocks at 'Where does NAME live?', Y at 'How old is NAME?' (owner, 16 Nov: the bitcrusher came on at the reverb step), lasers at their screen (and stay unlocked)
  const yHeld = n >= idx('home') && n < idx('age') ? P.GATE_Y_HELD : 0;
  const want = (S.gate & ~P.GATE_Y_HELD) | yHeld | (n >= idx('rhythm') && n !== idx('load') ? P.GATE_RHYTHM : 0) | (n >= idx('home') && n !== idx('load') ? P.GATE_EFFECTS : 0) | (n >= idx('lasers') && n !== idx('load') ? P.GATE_LASERS : 0);   // (the rhythm: owner, 27 Oct)
  if (want !== S.gate) { S.gate = want; sendRobot(0); }
  S.step = n; S.tip = false; S.tr = newTrack(); S.codeBad = false; S.explain = null; S.knobNote = null; S.heard8 = []; draw(); buttons();
}

// ---------------- colours ----------------
function setTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('[data-theme-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeSet === t)));
  try { localStorage.setItem('robopera2.theme', t); } catch (e) {}
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-theme-set]'); if (b) setTheme(b.dataset.themeSet); });
(() => { let t = 'fun'; try { t = localStorage.getItem('robopera2.theme') || 'fun'; } catch (e) {}   // first visit: Fun (owner)
  if (t === 'circuit') t = 'fun';                                                                       // (its first name)
  if (!['fun', 'auto', 'light', 'dark'].includes(t)) t = 'fun';
  setTheme(t); })();

// ---------------- start ----------------
window.addEventListener('load', () => {
  const showTesters = () => { if (/testers/.test(location.hash || '')) { document.getElementById('testers').hidden = false; if (S.status) testers(S.status); } };
  showTesters(); window.addEventListener('hashchange', showTesters);   // (no reload needed: V1 needed one)
  if (navigator.requestMIDIAccess) MIDISetup('MTMComputer', OnConnect, OnDisconnect);
  else setConn(false, 'This browser can’t talk to the Workshop System (try Chrome or Edge)');
  drawFace(null); draw(true);
});
</script>
</body>
