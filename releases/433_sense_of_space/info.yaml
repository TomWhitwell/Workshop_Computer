Name: 433 Sense of Space
short-description: A 4'33"-inspired room-ambience loop with a three-loop performance, countdown LEDs,
  restless fidgets, pulse restart and chair creaks.
Language: C++ (Pico SDK + ComputerCard)
Creator: Adrian Vos
Version: 0.2.1
Status: Beta
License: Mixed - original source and reverb components are MIT; dependencies retain their own licences; embedded BBC Sound Effects audio is subject to BBC Sound Effects Archive licensing
date-created: 2026-07-14
date-updated: 2026-07-16
demo-link: https://www.youtube.com/watch?v=9wxg1nU-I7g

contact:
  social:
    github: https://github.com/soveda

tags:
  - ambience
  - reverb
  - sampler
  - experimental
  - foley

summary: Listen to the room, audience and small movements around an imagined performance. This
  is a sound work inspired by 4'33", not a recording or reconstruction of a performance.
  Choose the 2 MB build for compact 10 kHz stereo 8-bit ambience, or the 16 MB build for
  cleaner 24 kHz stereo 16-bit ambience. Switch Up stops and arms the card; Middle
  starts three 91 second loops sourced from 1:30-3:01 of the BBC recording. The
  left-column LEDs count down from three loops to zero. Press Down or trigger Pulse In 1
  for a short chair/stool creak, as if the musician shifted in their seat. Pulse In 2
  restarts the whole performance.

panel:
  inputs:
    - id: PulseIn1
      name: Seat Creak
      type: pulse
      description: Trigger a chair/stool creak one-shot on a rising edge
    - id: PulseIn2
      name: Restart
      type: pulse
      description: Restart the three-loop sound work from the beginning on a rising edge
  outputs:
    - id: AudioOut1
      name: Left
      type: audio
      description: Left stereo output
    - id: AudioOut2
      name: Right
      type: audio
      description: Right stereo output

controls:
  switch:
    up:
      name: Stop / Arm
      description: Stop playback, reset to the beginning, and light all three countdown LEDs.
    middle:
      name: Start
      description: Start a three-loop 4'33" performance from the beginning.
    down:
      name: Seat Creak
      description: Trigger a short chair/stool creak one-shot.
  knobs:
    - main:
        name: Restlessness
        description: Adds occasional quieter automatic chair/stool creaks
      x:
        name: Space
        description: Reverb character, from small room to a restrained cathedral-like hall
      y:
        name: Amount
        description: Dry/wet reverb amount
  leds:
    - display: list
      items:
        - id: LED0
          name: Loop 1 remaining
        - id: LED2
          name: Loop 2 remaining
        - id: LED4
          name: Loop 3 remaining
        - id: LED1
          name: Running indicator
        - id: LED3
          name: Running indicator
        - id: LED5
          name: Running indicator
