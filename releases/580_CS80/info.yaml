draft: true
Name: CS80
short-description: Draft mono CS-80-inspired synth voice with Web MIDI editing.
summary: >-
  Draft card scaffold for a Yamaha CS-80-inspired Workshop Computer synth voice.
  The first firmware target is a lean mono voice with two oscillator lanes,
  expressive envelopes, high-pass and low-pass filter character, ring modulation,
  MIDI/Web MIDI control, and a browser editor. The code is intended to be shaped
  so a second voice can be added after the mono engine has been profiled and
  proven on hardware.
Language: C++ (Pico SDK)
Creator: Adrian Vos
Version: "0.1 draft"
Status: Draft - first-pass mono firmware and Web MIDI patch interface
License: MIT
date-created: 2026-08-26
Editor: web

tags:
  - synth
  - midi
  - web-midi
  - mono
  - cs-80-inspired
  - draft

panel:
  inputs:
    - id: AudioIn1
      name: Pitch CV
      type: audio
      description: "Web-selectable 1V/oct pitch input: 0 V to +5 V with C4 at +3 V, or -3 V to +3 V with C4 at 0 V."
    - id: AudioIn2
      name: Audio / Mod In
      type: audio
      description: Reserved for future audio-rate modulation or external processing experiments.
    - id: CVIn1
      name: Filter CV
      type: cv
      description: Wide high-pass and low-pass filter modulation.
    - id: CVIn2
      name: Expression CV
      type: cv
      description: Expression input for brightness and resonance modulation.
    - id: PulseIn1
      name: Gate
      type: pulse
      description: Planned gate input for the amp and filter envelopes.
    - id: PulseIn2
      name: Trigger / Hold
      type: pulse
      description: Reserved for retrigger, sustain, or alternate performance gestures.
  outputs:
    - id: AudioOut1
      name: Mono Out
      type: audio
      description: Planned main mono synthesiser output.
    - id: AudioOut2
      name: Alt Out
      type: audio
      description: Reserved for dry/wet, alternate filter tap, or future dual-voice output.
    - id: CVOut1
      name: Off
      type: cv
      description: Reserved for later modulation output once the mono voice is stable.
    - id: CVOut2
      name: Off
      type: cv
      description: Reserved for later modulation output once the mono voice is stable.
    - id: PulseOut1
      name: Off
      type: pulse
      description: Reserved for later clock, gate, or envelope-state output.
    - id: PulseOut2
      name: Off
      type: pulse
      description: Reserved for later clock, gate, or envelope-state output.

controls:
  switch:
    up:
      name: Oscillator page
      description: Pitch offset, pulse width, and PWM amount for the mono voice, with soft pickup.
    middle:
      name: Filter page
      description: High-pass cutoff, low-pass cutoff, and resonance for the mono voice, with soft pickup.
    down:
      name: Performance page
      description: Hold page for temporary pitch offset, ring modulation, and LFO-to-pitch depth, with soft pickup.
  knobs:
    - when:
        z: up
      main:
        name: Pitch / Spread
        description: Pitch offset for the mono voice.
      x:
        name: Pulse Width
        description: Pulse width for the mono voice.
      y:
        name: PWM Amount
        description: Pulse-width modulation amount for the mono voice. The independent source mixer is Web-editor controlled.
    - when:
        z: middle
      main:
        name: HP Cutoff
        description: High-pass filter cutoff.
      x:
        name: LP Cutoff
        description: Low-pass filter cutoff.
      y:
        name: Resonance
        description: Filter resonance.
    - when:
        z: down
      main:
        name: Pitch Offset
        description: Temporary pitch offset while Down is held.
      x:
        name: Ring Mod
        description: Ring-modulation amount.
      y:
        name: LFO to Pitch
        description: Vibrato depth. LFO-to-PWM, filter, and amp routings are independently controlled in the Web editor.
  leds:
    - display: list
      items:
        - id: LED0
          name: Main Value
          description: Stored Main parameter value for the active switch page.
        - id: LED1
          name: Main Pickup
          description: Soft-pickup state for the Main knob; dim until picked up, bright when active.
        - id: LED2
          name: X Value
          description: Stored X parameter value for the active switch page.
        - id: LED3
          name: X Pickup
          description: Soft-pickup state for the X knob; dim until picked up, bright when active.
        - id: LED4
          name: Y Value
          description: Stored Y parameter value for the active switch page.
        - id: LED5
          name: Y Pickup
          description: Soft-pickup state for the Y knob; dim until picked up, bright when active.

host:
  usb:
    - name: Web MIDI editor
      role: device
      description: Draft browser editor using Web MIDI SysEx for patch apply, readback, and eight persistent card slots.
    - name: USB MIDI input
      role: host-or-device
      description: MIDI note/gate, pitch-bend, and performance CC input for the draft mono voice, following a Gnarly-style dedicated controller block with standard synth aliases.
  notes: >-
    Draft architecture target: RP2040 at 192 MHz, copy-to-RAM firmware, audio
    rendering on core 0, USB MIDI/Web MIDI work on core 1, and bounded lockless
    queues for complete patch handoff and core-0 readback. The first goal is a robust mono voice;
    dual voice should wait until the mono implementation is lean and profiled.
    Current draft firmware stores eight Web MIDI patch slots in flash. The Web
    editor can choose a saved startup slot, and holding Down during the startup
    selection window lets Main override it, with the LEDs showing the slot
    number. With no saved startup slot, the compiled fallback is the Web
    editor's Doctor Who Theme preset, including its portamento setting. Each saved patch includes its pitch-CV range mode. Web MIDI patch
    readback and saved slots
    cover the visible editor controls, including independent additive
    saw/pulse/sine/noise source levels, voice level, portamento, expression depth, LFO rate,
    independent LFO-to-pitch/PWM/VCF/VCA modulation depths, ring amount, and
    ring speed. The current MIDI controller map is: CC1 LFO-to-pitch,
    CC2/11 expression depth, CC5 portamento, CC7 voice level, CC16-19
    saw/pulse/sine/noise levels, CC20 pulse width, CC21 PWM amount, CC22 HP
    cutoff, CC23 or CC74 LP cutoff, CC24 or CC71 resonance, CC25 ring amount,
    CC26 ring speed, CC27 or CC73 attack, CC28 or CC75 decay, CC29 sustain,
    CC30 or CC72 release, CC76 LFO rate, CC77 or CC93 LFO-to-PWM, CC91
    LFO-to-VCF, CC92 LFO-to-VCA, and pitch bend at +/-2 semitones.


    Attribution: included computercard.h is ComputerCard by Chris Johnson,
    version 0.3.0, MIT licensed, copied from
    Demonstrations+HelloWorlds/PicoSDK/ComputerCard/ComputerCard.h. The
    included pico_sdk_import.cmake is the standard Raspberry Pi Pico SDK import
    helper and carries the Raspberry Pi (Trading) Ltd. BSD-style notice in the
    file. USB MIDI host helper files are copied from the local C1ZZL3 cards and
    retain the upstream rppicomidi MIT notices in source. The TinyUSB
    descriptor/config pattern is adapted from Adrian Vos's C1ZZL3 cards.

