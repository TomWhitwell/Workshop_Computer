draft: false
Name: The Bells
short-description: Bellringing methods sequencer — any 12 change-ringing methods (up to Maximus) from the CCCBR library and six editable scales, set in a web editor, with tempo and jitter
summary: |
  A bellringing methods sequencer: plays 12 English change-ringing methods — by
  default Plain Hunt Minimus through Plain Bob Triples, and from v1.2 any method up
  to 12 bells, chosen in the web editor from the CCCBR collection or written as place
  notation — sending each row of the
  method as a v/oct pitch sequence quantised to one of six scales, with a synchronised
  gate pulse per bell strike. Intended to drive oscillators or other CV inputs that can
  respond to permutation patterns.

  Z switch selects mode: Up = Play, Middle = Stop, Down (hold) = Edit. While held down,
  turning a knob selects that knob's edit-mode parameter (method / clock divide / scale);
  releasing Z returns to Play/Stop with the new parameter applied.
Language: C++ (Pico SDK + ComputerCard)
Creator: James Saunders
Version: 1.4.0
Status: Released
License: MIT
Editor: web
demo-link: https://youtu.be/jAWV7_NaBM0?si=06GFGjHGklVmo8Ig
date-created: 2026-06-27
date-updated: 2026-11-11
contact:
