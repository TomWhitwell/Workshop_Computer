draft: true
Name: USB MIDI Host
short-description: USB MIDI host/device to CV, gate, and audio, with a browser editor for config and testing
summary: |
  **USB MIDI Host** maps USB MIDI to calibrated CV/Gate plus audio (poly engines + ADSR),
  with host SETUP/MIDI-learn for CC/knob maps (voice, arp, reverb, envelope), stroke LED feedback,
  and a web editor in device mode.
Language: C++ (Pico SDK + ComputerCard)
Creator: Dan Galbraith
Version: "0.9.0"
License: MIT
Status: Beta
Editor: web
date-created: 2026-08-08
date-updated: 2026-09-01

